<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블루리본 런처</title>
<style>
  :root {
    --bg: #F6F7F9; --card: #FFFFFF; --text: #1A1D21; --muted: #6B7280;
    --line: #E5E8EC; --accent: #2B6FF3;
    --c-han:#A3572E; --c-jung:#B4432E; --c-il:#2D6E63; --c-yang:#5B4B8A;
    --c-dessert:#B8577E; --c-cafe:#6B5738; --c-etc:#6B6B63;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181C; --card: #1F2328; --text: #ECEEF0; --muted: #9AA3AD; --line: #2E343B; }
  }
  :root[data-theme="dark"] { --bg: #16181C; --card: #1F2328; --text: #ECEEF0; --muted: #9AA3AD; --line: #2E343B; }
  :root[data-theme="light"] { --bg: #F6F7F9; --card: #FFFFFF; --text: #1A1D21; --muted: #6B7280; --line: #E5E8EC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Apple SD Gothic Neo", Pretendard, -apple-system, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 48px; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  h1 { font-size: 22px; line-height: 1.3; margin: 6px 0 16px; text-wrap: balance; }

  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .crumb { font-size: 12.5px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); }
  .crumb.active { color: var(--text); font-weight: 700; border-color: var(--accent); }
  .crumb.clickable { cursor: pointer; }
  .crumb.reset { color: var(--accent); border-color: var(--accent); cursor: pointer; }

  .ribbon-seg { display: flex; gap: 6px; margin-bottom: 18px; }
  .ribbon-seg button { flex: 1; font: inherit; font-size: 13px; font-weight: 600; padding: 9px 4px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .ribbon-seg button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    padding: 14px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    font: inherit; color: var(--text); text-align: left; }
  .tile-btn .name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .tile-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .tile-btn .n { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile-btn.all { grid-column: 1 / -1; background: var(--accent); color: #fff; border-color: var(--accent); }
  .tile-btn.all .n { color: rgba(255,255,255,.8); }

  .section-title { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .loc-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 20px;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent); }
  .sel { font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); }
  .sort-seg { display: flex; gap: 6px; }
  .sort-seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 18px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .sort-seg button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .loc-status { font-size: 12px; color: var(--muted); margin: -6px 0 16px; }

  .result-count { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .card-head { padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card-name { font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .card-name .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .card-addr { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-badges { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .badge.r3 { background: #E9C46A; color: #2A1F0C; }
  .badge.r2 { background: var(--line); color: var(--muted); }
  .badge.dist { background: var(--accent); color: #fff; }
  .card-panel { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--line); }
  .card.open .card-panel { display: block; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  a.btn { display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; border-radius: 10px; font-size: 15px; font-weight: 700;
    text-decoration: none; border: 1px solid var(--line); }
  .kakaomap { background: #E08A52; color: #1A1D21; border-color: #C97740; }
  .tmap  { background: #0264FB; color: #fff; border-color: #0257D8; }
  .naver { background: #03C75A; color: #fff; border-color: #02AD4E; }
  .apple { background: #F2F2F4; color: #1D1D1F; border-color: #D6D6DB; }
  .google{ background: #8A8078; color: #1A1D21; border-color: #736A63; }

  .empty { font-size: 14px; color: var(--muted); text-align: center; padding: 40px 10px; }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 24px;
    border-top: 1px solid var(--line); padding-top: 14px; }

  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 15px; }
  .search-input::placeholder { color: var(--muted); }

  .card-photo { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px;
    margin-top: 10px; background: var(--bg); }
  .card-desc { font-size: 13.5px; line-height: 1.55; margin: 10px 0 0; color: var(--text); }
  .menu-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .menu-tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    background: var(--bg); border: 1px solid var(--line); color: var(--text); }
  .review-box { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg);
    border: 1px solid var(--line); }
  .review-box p { margin: 0; font-size: 13px; font-style: italic; color: var(--text); line-height: 1.5; }
  .review-src { display: inline-block; margin-top: 6px; font-size: 11.5px; color: var(--accent); text-decoration: none; }
  .content-pending { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>

<div class="wrap">
  <div class="eyebrow">블루리본서베이 2026 · 251/252곳 위치 확인</div>
  <h1>블루리본 맛집 런처</h1>

  <div class="search-wrap">

const CATS = ["한식","중식","일식","양식","디저트","카페","기타"];
const CAT_COLOR = {"한식":"var(--c-han)","중식":"var(--c-jung)","일식":"var(--c-il)","양식":"var(--c-yang)","디저트":"var(--c-dessert)","카페":"var(--c-cafe)","기타":"var(--c-etc)"};
const REGIONS = [...new Set(DATA.map(d => d.sido))];

const state = { ribbon: "all", cat: null, region: null, sort: "rating", radius: null };
let userLoc = null;
let searchQuery = "";

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function byRibbon(list) {
  if (state.ribbon === "all") return list;
  return list.filter(d => String(d.ribbon) === state.ribbon);
}
function byCat(list) { return (state.cat && state.cat !== "__ALL__") ? list.filter(d => d.cat === state.cat) : list; }
function byRegion(list) { return (state.region && state.region !== "__ALL__") ? list.filter(d => d.sido === state.region) : list; }

function mapLinks(item) {
  const enc = encodeURIComponent(item.name);
  const la = item.lat, lo = item.lon;
  const addrEnc = item.addr ? encodeURIComponent(item.addr) : null;
  if (la != null && lo != null) {
    return [
      { cls: "tmap", label: "T맵으로 안내", href: `tmap://route?rGoName=${enc}&rGoX=${lo}&rGoY=${la}` },
      { cls: "naver", label: "네이버지도로 안내", href: `nmap://route/car?dlat=${la}&dlng=${lo}&dname=${enc}&appname=com.studio209.inboxautopilot` },
      { cls: "kakaomap", label: "카카오맵 길안내(차량)", href: `kakaomap://route?ep=${la},${lo}&by=CAR` },
      { cls: "apple", label: "Apple 지도에서 보기", href: `https://maps.apple.com/?q=${enc}&ll=${la},${lo}` },
      { cls: "google", label: "구글지도로 안내", href: `https://www.google.com/maps/dir/?api=1&destination=${addrEnc || enc}&travelmode=driving` },
    ];
  }
  return [
    { cls: "tmap", label: "T맵에서 검색", href: `tmap://search?name=${enc}` },
    { cls: "naver", label: "네이버지도에서 검색", href: `https://map.naver.com/p/search/${enc}` },
    { cls: "kakaomap", label: "카카오맵에서 검색", href: `https://map.kakao.com/link/search/${enc}` },
    { cls: "apple", label: "Apple 지도에서 검색", href: `https://maps.apple.com/?q=${enc}` },
    { cls: "google", label: "구글지도에서 검색", href: `https://www.google.com/maps/search/?api=1&query=${enc}` },
  ];
}

function renderRibbonSeg() {
  const seg = document.getElementById("ribbonSeg");
  const opts = [["all","전체"],["3","3개 리본"],["2","2개 리본"]];
  seg.innerHTML = opts.map(([v,l]) => `<button data-v="${v}" class="${state.ribbon===v?"active":""}">${l}</button>`).join("");
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state.ribbon = b.getAttribute("data-v");
    render();
  }));
}

function renderCrumbs() {
  const el = document.getElementById("crumbs");
  const items = [];
  items.push(`<span class="crumb reset" id="crumbReset">처음부터</span>`);
  if (searchQuery.trim()) {
    items.push(`<span class="crumb active">검색: ${searchQuery.trim()}</span>`);
  } else {
    if (state.cat) items.push(`<span class="crumb clickable active" data-to="cat">${state.cat === "__ALL__" ? "전체" : state.cat}</span>`);
    if (state.cat && state.region) items.push(`<span class="crumb clickable active" data-to="region">${state.region === "__ALL__" ? "전체 지역" : state.region}</span>`);
  }
  el.innerHTML = items.join("");
  const reset = document.getElementById("crumbReset");
  if (reset) reset.addEventListener("click", () => {
    state.cat = null; state.region = null;
    searchQuery = ""; const si = document.getElementById("searchInput"); if (si) si.value = "";
    render();
  });
  el.querySelectorAll(".crumb.clickable").forEach(c => c.addEventListener("click", () => {
    const to = c.getAttribute("data-to");
    if (to === "cat") { state.cat = null; state.region = null; }
    if (to === "region") { state.region = null; }
    render();
  }));
}

function currentList() {
  const q = searchQuery.trim();
  if (q) return byRibbon(DATA).filter(d => d.name.includes(q) || (d.note && d.note.includes(q)) || (d.group && d.group.includes(q)));
  return byRegion(byCat(byRibbon(DATA)));
}

function screenCategory() {
  const base = byRibbon(DATA);
  let html = `<p class="section-title">1단계 · 음식 종류를 골라주세요</p><div class="grid">`;
  html += `<button class="tile-btn all" data-cat="__ALL__"><span class="name">전체 보기</span><span class="n">${base.length}곳</span></button>`;
  CATS.forEach(c => {
    const n = base.filter(d => d.cat === c).length;
    html += `<button class="tile-btn" data-cat="${c}"><span class="name"><span class="dot" style="background:${CAT_COLOR[c]}"></span>${c}</span><span class="n">${n}곳</span></button>`;
  });
  html += `</div>`;
  document.getElementById("screen").innerHTML = html;
  document.querySelectorAll(".tile-btn[data-cat]").forEach(b => b.addEventListener("click", () => {
    const v = b.getAttribute("data-cat");
    state.cat = v === "__ALL__" ? "__ALL__" : v;
    render();
  }));
}

function screenRegion() {
  const base = byCat(byRibbon(DATA));
  let html = `<p class="section-title">2단계 · 지역을 골라주세요</p><div class="grid">`;
  html += `<button class="tile-btn all" data-region="__ALL__"><span class="name">전체 지역</span><span class="n">${base.length}곳</span></button>`;
  REGIONS.forEach(r => {
    const n = base.filter(d => d.sido === r).length;
    if (n === 0) return;
    html += `<button class="tile-btn" data-region="${r}"><span class="name">${r}</span><span class="n">${n}곳</span></button>`;
  });
  html += `</div>`;
  document.getElementById("screen").innerHTML = html;
  document.querySelectorAll(".tile-btn[data-region]").forEach(b => b.addEventListener("click", () => {
    const v = b.getAttribute("data-region");
    state.region = v === "__ALL__" ? "__ALL__" : v;
    render();
  }));
}

function requestLocation() {
  const status = document.getElementById("locStatus");
  if (status) status.textContent = "위치 확인 중...";
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      state.sort = "distance";
      render();
    },
    err => {
      if (status) status.textContent = "위치를 가져오지 못했습니다 (" + err.message + "). 이름순으로 봅니다.";
      state.sort = "name";
      renderResultsList();
    },
    { enableHighAccuracy: false, timeout: 8000 }
  );
}

function screenResults() {
  const isSearch = !!searchQuery.trim();

  let html = `<div class="controls">`;
  if (!userLoc) {
    html += `<button class="loc-btn" id="locBtn">내 위치로 거리순 정렬</button>`;
  }
  html += `<div class="sort-seg" id="sortSeg">
      <button data-s="rating" ${state.sort==="rating"?"class=\"active\"":""}>등급순</button>
      <button data-s="distance" ${state.sort==="distance"?"class=\"active\"":""} ${!userLoc?"disabled":""}>거리순</button>
      <button data-s="name" ${state.sort==="name"?"class=\"active\"":""}>이름순</button>
    </div>`;
  if (userLoc) {
    html += `<select class="sel" id="radiusSel">
      <option value="">반경 전체</option>
      <option value="1">1km 이내</option>
      <option value="3">3km 이내</option>
      <option value="5">5km 이내</option>
      <option value="10">10km 이내</option>
      <option value="20">20km 이내</option>
      <option value="50">50km 이내</option>
    </select>`;
  }
  html += `</div>`;
  if (!userLoc) html += `<p class="loc-status" id="locStatus"></p>`;

  const title = isSearch ? `"${searchQuery.trim()}" 검색 결과` : "3단계 · 결과";
  document.getElementById("screen").innerHTML = `<p class="section-title">${title}</p>` + html + `<div id="resultsList"></div>`;

  const locBtn = document.getElementById("locBtn");
  if (locBtn) locBtn.addEventListener("click", requestLocation);
  document.querySelectorAll("#sortSeg button").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    state.sort = b.getAttribute("data-s");
    renderResultsList();
  }));
  const radiusSel = document.getElementById("radiusSel");
  if (radiusSel) {
    radiusSel.value = state.radius || "";
    radiusSel.addEventListener("change", () => { state.radius = radiusSel.value || null; renderResultsList(); });
  }

  renderResultsList();
}

function renderResultsList() {
  let list = currentList().slice();

  if (userLoc) {
    list.forEach(d => { d._dist = (d.lat != null) ? haversine(userLoc.lat, userLoc.lon, d.lat, d.lon) : Infinity; });
    if (state.radius) list = list.filter(d => d._dist <= Number(state.radius));
  }

  if (state.sort === "distance" && userLoc) {
    list.sort((a, b) => a._dist - b._dist);
  } else if (state.sort === "rating") {
    list.sort((a, b) => b.ribbon - a.ribbon || a.name.localeCompare(b.name, "ko"));
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  }

  const wrap = document.getElementById("resultsList");
  if (!list.length) {
    wrap.innerHTML = `<p class="empty">조건에 맞는 곳이 없습니다. 반경을 넓히거나 필터를 바꿔보세요.</p>`;
    return;
  }
  let html = `<p class="result-count">${list.length}곳</p>`;
  list.forEach((d, i) => {
    const distLabel = (userLoc && d._dist != null && isFinite(d._dist)) ? `<span class="badge dist">${d._dist < 1 ? Math.round(d._dist*1000)+"m" : d._dist.toFixed(1)+"km"}</span>` : "";
    html += `<div class="card" id="card-${i}">
      <div class="card-head" data-i="${i}">
        <div class="card-main">
          <div class="card-name"><span class="dot" style="background:${CAT_COLOR[d.cat]}"></span>${d.name}</div>
          <div class="card-addr">${d.addr || d.loc}${d.note ? " · " + d.note : ""}</div>
        </div>
        <div class="card-badges">
          ${distLabel}
          <span class="badge ${d.ribbon===3?"r3":"r2"}">${d.ribbon}개</span>
        </div>
      </div>
      <div class="card-panel" id="panel-${i}"></div>
    </div>`;
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll(".card-head").forEach(h => h.addEventListener("click", () => {
    const i = h.getAttribute("data-i");
    const card = document.getElementById("card-" + i);
    const panel = document.getElementById("panel-" + i);
    const isOpen = card.classList.contains("open");
    wrap.querySelectorAll(".card.open").forEach(c => c.classList.remove("open"));
    if (!isOpen) {
      card.classList.add("open");
      if (!panel.dataset.filled) {
        const item = list[Number(i)];
        panel.innerHTML = buildPanel(item);
        panel.dataset.filled = "1";
      }
    }
  }));
}

function buildPanel(item) {
  let html = "";
  if (item.photo) html += `<img class="card-photo" src="${item.photo}" alt="${item.name}" loading="lazy">`;
  if (item.desc) html += `<p class="card-desc">${item.desc}</p>`;
  if (item.menu && item.menu.length) {
    html += `<div class="menu-tags">${item.menu.map(m => `<span class="menu-tag">${m}</span>`).join("")}</div>`;
  }
  if (item.review) {
    const rev = typeof item.review === "string" ? { summary: item.review } : item.review;
    html += `<div class="review-box"><p>&ldquo;${rev.summary}&rdquo;</p>${rev.source ? `<a class="review-src" href="${rev.source}" target="_blank" rel="noopener">출처 보기</a>` : ""}</div>`;
  }
  if (item.place_url) {
    html += `<a class="review-src" style="display:block;margin-top:${item.desc||item.photo?'2px':'10px'}" href="${item.place_url}" target="_blank" rel="noopener">카카오맵에서 사진·리뷰 더 보기 &rsaquo;</a>`;
  }
  if (!item.photo && !item.desc && !(item.menu && item.menu.length) && !item.review) {
    html += `<p class="content-pending">소개·추천메뉴·리뷰 요약은 준비 중입니다.</p>`;
  }
  const btns = mapLinks(item).map(b => `<a class="btn ${b.cls}" href="${b.href}">${b.label}</a>`).join("");
  html += `<div class="btns">${btns}</div>`;
  return html;
}

const searchInputEl = document.getElementById("searchInput");
searchInputEl.addEventListener("input", () => {
  searchQuery = searchInputEl.value;
  render();
});

function render() {
  renderRibbonSeg();
  renderCrumbs();
  if (searchQuery.trim()) { screenResults(); return; }
  if (!state.cat) { screenCategory(); return; }
  if (!state.region) { screenRegion(); return; }
  screenResults();
}

render();
</script>
</body>
</html>
