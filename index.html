<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: 홈 화면에 추가해 전체화면(standalone)으로 뜨면 상단
     노치·하단 홈바 영역까지 화면이 확장된다. 아래 .wrap 의 safe-area 패딩과 짝 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길안내</title>

<!-- 홈 화면에 추가(PWA) — 아이폰에서 앱처럼 쓰기 위한 설정 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="길안내">
<!-- black-translucent: 상태바를 페이지 배경 위에 겹쳐 라이트/다크 모두 자연스럽게 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181C" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #F6F7F9; --card: #FFFFFF; --text: #1A1D21; --muted: #6B7280;
    --line: #E5E8EC; --accent: #2B6FF3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181C; --card: #1F2328; --text: #ECEEF0; --muted: #9AA3AD; --line: #2E343B; }
  }
  :root[data-theme="dark"] { --bg: #16181C; --card: #1F2328; --text: #ECEEF0; --muted: #9AA3AD; --line: #2E343B; }
  :root[data-theme="light"] { --bg: #F6F7F9; --card: #FFFFFF; --text: #1A1D21; --muted: #6B7280; --line: #E5E8EC; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    /* 가로 넘침이 생기면 아이폰에서 가운데 정렬이 풀린 것처럼 보인다 */
    overflow-x: hidden;
    font-family: "Apple SD Gothic Neo", Pretendard, -apple-system, sans-serif; }
  /* safe-area: 홈 화면에 추가해 전체화면으로 뜰 때 노치·홈바를 피한다.
     Safari 로 볼 때는 env() 가 0 이라 기존 여백 그대로다. */
  .wrap { max-width: 420px; margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
             calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
  .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 2px; text-wrap: balance; }
  .when { font-size: 15px; color: var(--muted); margin-bottom: 20px; }
  .resolved { font-size: 13px; color: var(--muted); margin: 14px 0 0;
    font-variant-numeric: tabular-nums; }
  .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  a.btn { display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 56px; border-radius: 12px; font-size: 17px; font-weight: 700;
    text-decoration: none; border: 1px solid var(--line); }
  a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .kakao { background: #FAE100; color: #191600; border-color: #E8D100; }
  .kakaomap { background: #E08A52; color: #1A1D21; border-color: #C97740; }
  .tmap  { background: #0264FB; color: #fff; border-color: #0257D8; }
  .naver { background: #03C75A; color: #fff; border-color: #02AD4E; }
  .apple { background: #F2F2F4; color: #1D1D1F; border-color: #D6D6DB; }
  .web   { background: var(--card); color: var(--text); }
  .google{ background: #8A8078; color: #1A1D21; border-color: #736A63; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 22px;
    border-top: 1px solid var(--line); padding-top: 14px; }
  .missing { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; font-size: 14px; line-height: 1.6; margin-top: 18px; }
  .notice { font-size: 14px; line-height: 1.6; margin: 4px 0 18px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  /* 검색은 맨 위 — 아래 목적지 영역과 구분선으로 갈라 준다(2026-08-16 사용자 지정) */
  .search { margin: 0 0 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .search-row { display: flex; gap: 8px; }
  /* font-size 는 반드시 16px 이상 — iOS Safari 는 16px 미만 입력창을 탭하면
     페이지를 자동 확대해 버린다. 확대되면 가운데 정렬이 풀리고 오른쪽이
     잘려 나간다(2026-08-17 아이폰에서 확인). min-width:0 은 flex 아이템의
     기본 min-width:auto 때문에 입력창이 안 줄어들어 생기는 가로 넘침 방지. */
  .search-row input { flex: 1; min-width: 0; height: 46px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 16px; padding: 0 12px; -webkit-appearance: none; appearance: none; }
  .search-row input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .search-hint { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
  /* 집·사무실·처음으로 아이콘 바 */
  .quickbar { display: flex; gap: 8px; margin-top: 10px; }
  .chip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text); font-size: 11px; line-height: 1; }
  .chip svg { width: 21px; height: 21px; fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  /* 아직 등록 안 된 집·사무실은 점선+흐리게 — 눌러야 할 게 남았다는 신호 */
  .chip.unset { color: var(--muted); border-style: dashed; }
  /* 등록 대기(칩을 눌러 '다음에 고르는 장소를 여기 저장' 상태) */
  .chip.pending { border-style: solid; border-color: var(--accent); color: var(--accent); }
  .savebar { display: flex; gap: 8px; margin-top: 14px; }
  .savebar button { flex: 1; height: 38px; border-radius: 10px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .savebar button.on { border-color: var(--accent); color: var(--accent); }
  /* 최근 검색 */
  .recent { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .recent-head { display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .recent-head button { border: none; background: none; color: var(--muted);
    font-size: 12px; text-decoration: underline; padding: 4px 2px; }
  .recent-item { display: flex; align-items: center; gap: 8px; }
  .recent-item > button.pick { flex: 1; min-width: 0; text-align: left; border: none;
    background: none; color: var(--text); padding: 10px 2px; font-size: 15px; }
  .recent-item .rn { font-weight: 600; }
  .recent-item .ra { color: var(--muted); font-size: 12px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-item > button.del { flex: none; border: none; background: none;
    color: var(--muted); font-size: 18px; line-height: 1; padding: 8px 6px; }
  .search-results { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: none; }
  .search-results.show { display: block; }
  .search-results button { display: block; width: 100%; text-align: left; background: var(--card);
    color: var(--text); border: none; border-bottom: 1px solid var(--line); padding: 12px 14px;
    font-size: 14px; line-height: 1.4; }
  .search-results button:last-child { border-bottom: none; }
  .search-results button:hover, .search-results button:focus-visible { background: var(--bg); }
  .search-results a.maplink { display: block; padding: 12px 14px; font-size: 14px;
    background: var(--bg); color: var(--accent); text-decoration: none;
    border-bottom: 1px solid var(--line); }
  .search-results a.maplink:last-child { border-bottom: none; }
  .search-results .rname { font-weight: 700; }
  .search-results .raddr { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .search-status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  /* 홈 화면 아이콘으로 열었을 때(목적지 없음) 보여 주는 빈 화면 */
  .empty { text-align: center; padding: 44px 8px 20px; }
  .empty-mark { font-size: 44px; line-height: 1; }
  .empty-title { font-size: 19px; font-weight: 700; margin: 14px 0 6px; }
  .empty-sub { font-size: 14px; line-height: 1.7; color: var(--muted); margin: 0; }
</style>
</head>
<body>


<div class="wrap">
  <div class="search">
    <!-- 검색 버튼 없음 — 입력하는 동안 자동으로 검색된다(디바운스) -->
    <div class="search-row">
      <input id="searchInput" type="search" inputmode="search" placeholder="지명·주소 검색"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        enterkeyhint="search">
    </div>
    <!-- 집·사무실 바로가기 + 처음으로 (아이콘) -->
    <div class="quickbar">
      <button class="chip" id="chipHome" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>집</span>
      </button>
      <button class="chip" id="chipOffice" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4h11v17"/><path d="M15 10h5v11"/><path d="M2 21h20"/><path d="M7.5 8h1M11 8h1M7.5 12h1M11 12h1M7.5 16h1M11 16h1"/></svg>
        <span>사무실</span>
      </button>
      <button class="chip" id="chipReset" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.9 13.4A8 8 0 1 1 18 7.1"/><path d="M18.7 3.1v4.5h-4.5"/></svg>
        <span>처음으로</span>
      </button>
    </div>
    <p class="search-hint" id="searchHint">검색해서 고르면 아래 목적지가 그 장소로 바뀝니다.</p>
    <p class="search-status" id="searchStatus"></p>
    <div class="search-results" id="searchResults"></div>

    <!-- 최근 검색: 고른 목적지를 좌표까지 저장해 두므로 다시 누르면 재검색 없이 바로 뜬다 -->
    <div class="recent" id="recent" hidden>
      <div class="recent-head">
        <span>최근 검색</span>
        <button type="button" id="recentClear">전체 삭제</button>
      </div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- 목적지 영역. 홈 화면 아이콘으로 열면(링크 파라미터 없음) 통째로 숨기고
       대신 아래 .empty 안내를 띄운다 — '약속 장소'라는 가짜 목적지가 뜨면 안 된다. -->
  <div id="dest">
    <div class="eyebrow">약속 장소 길안내</div>
    <h1 id="place">장소</h1>
    <div class="when" id="when"></div>
    <div class="notice" id="notice"></div>
    <!-- 지금 목적지를 집/사무실로 등록.
         내비 버튼 '위'에 둔다 — 아래에 두면 버튼 6개에 밀려 화면 밖으로
         나가서 등록 방법이 안 보인다(2026-08-17 사용자 피드백). -->
    <div class="savebar" id="saveBar" hidden>
      <button type="button" id="saveHome"></button>
      <button type="button" id="saveOffice"></button>
    </div>

    <div class="btns" id="btns"></div>
    <p class="resolved" id="resolved"></p>

    <p class="note">버튼을 누르면 해당 내비 앱이 목적지가 설정된 상태로 실행됩니다.
      앱이 설치돼 있지 않으면 반응이 없을 수 있어요.</p>
  </div>

  <div class="empty" id="empty" hidden>
    <div class="empty-mark">🧭</div>
    <p class="empty-title">어디로 갈까요?</p>
    <p class="empty-sub">위에서 지명이나 주소를 검색하면<br>T맵·네이버지도·카카오내비로 바로 안내를 시작합니다.</p>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.hash.slice(1));
  // d= : 한글 퍼센트 인코딩(글자당 9자)이 링크를 부풀려 base64url 로 압축한 형식.
  //      payload = 명칭 \x1f 위도 \x1f 경도 \x1f 일시 \x1f 주소
  //      예전 n/la/lo/w/a 링크도 계속 열리도록 폴백을 남겨 둔다.
  let name, la, lo, when, addr, notice;
  const d = p.get('d');
  // 목적지가 링크에 아예 없는 경우 = 홈 화면 아이콘으로 앱처럼 실행한 경우.
  // 이땐 가짜 '약속 장소'를 만들지 않고 검색 전용 빈 화면으로 시작한다.
  const hasDest = !!(d || p.get('n'));
  if (d) {
    const b = d.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
    const parts = new TextDecoder().decode(
      Uint8Array.from(bin, c => c.charCodeAt(0))).split('\u001f');
    name = parts[0] || '약속 장소';
    la = parseFloat(parts[1]); lo = parseFloat(parts[2]);
    when = parts[3] || ''; addr = parts[4] || ''; notice = parts[5] || '';
  } else {
    name = p.get('n') || '약속 장소';
    la = parseFloat(p.get('la')); lo = parseFloat(p.get('lo'));
    when = p.get('w') || '';
    addr = p.get('a') || '';
    notice = p.get('m') || '';
  }
  // 일시/안내문구는 검색으로 장소를 바꿔도 그대로 유지한다(약속 자체는 안 바뀌니까).
  const whenEl = document.getElementById('when');
  whenEl.textContent = when;
  if (!when) whenEl.style.display = 'none';
  const noticeEl = document.getElementById('notice');
  noticeEl.textContent = notice ? ('📢 ' + notice) : '';
  if (!notice) noticeEl.style.display = 'none';

  const btns = document.getElementById('btns');
  let missingEl = null;

  function btn(cls, label, href) {
    const a = document.createElement('a');
    a.className = 'btn ' + cls; a.textContent = label; a.href = href;
    btns.appendChild(a);
    return a;
  }

  // 장소 하나를 화면에 그린다 — 페이지 로드 시 링크의 원래 장소로 한 번,
  // 이후 아래 검색에서 다른 결과를 고를 때마다 다시 호출된다.
  function renderNav(placeName, placeLa, placeLo, placeAddr) {
    // 빈 화면 상태였다면(홈 화면 실행) 목적지 영역을 되살린다
    document.getElementById('dest').hidden = false;
    document.getElementById('empty').hidden = true;

    document.getElementById('place').textContent = placeName;
    document.title = '길안내 · ' + placeName;
    btns.innerHTML = '';
    if (missingEl) { missingEl.remove(); missingEl = null; }

    const enc = encodeURIComponent(placeName);

    if (isFinite(placeLa) && isFinite(placeLo)) {
      // 순서 고정(2026-08-04 사용자 지정): T맵 > 네이버 > 카카오내비 실행 > 카카오맵 길안내 > Apple 지도
      btn('tmap', 'T맵으로 안내', `tmap://route?rGoName=${enc}&rGoX=${placeLo}&rGoY=${placeLa}`);
      btn('naver', '네이버지도로 안내', `nmap://route/car?dlat=${placeLa}&dlng=${placeLo}&dname=${enc}&appname=com.studio209.inboxautopilot`);
      // 카카오내비 직접 '안내'는 유료 API 활성화가 필요해 보류 — 장소명 복사 후 앱 실행
      const knbtn = document.createElement('a');
      knbtn.className = 'btn kakao';
      knbtn.href = '#';
      knbtn.textContent = '카카오내비 실행 (장소명 복사)';
      knbtn.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await navigator.clipboard.writeText(placeName);
          knbtn.textContent = '복사됨! 검색창에 붙여넣기 하세요';
        } catch (_) { /* 클립보드 거부돼도 실행은 진행 */ }
        setTimeout(() => { location.href = 'kakaonavi://'; }, 250);
      });
      btns.appendChild(knbtn);
      // 카카오맵만 유니버설 링크(https)를 쓴다 → iOS의 "'카카오맵'에서 열겠습니까?"
      // 확인창 없이 앱이 바로 뜬다. 근거(2026-08-17 실측):
      //   · applink.map.kakao.com/.well-known/apple-app-site-association 에
      //     net.daum.maps 가 paths:["*"] 로 등록돼 있다 = 전 경로가 유니버설 링크.
      //   · 반면 map.kakao.com AASA 에는 NOT "/link/*" 가 박혀 있어 예전에 쓰던
      //     map.kakao.com/link/... 는 앱으로 안 넘어가고 확인창을 거쳤다.
      //   · 파라미터 형식은 카카오 자신이 /link/to/ 에서 이 URL 로 리다이렉트하는
      //     형태를 그대로 따랐다(sp/sn 은 출발지, 비우면 현재위치).
      //   · 좌표는 자르지 말고 원본 정밀도로 넘길 것(끝자리를 줄이면 404 로 떨어졌다).
      btn('kakaomap', '카카오맵 길안내(차량)',
        `https://applink.map.kakao.com/route?sp=&sn=&ep=${placeLa}%2C${placeLo}&en=${enc}&by=car`);
      btn('apple', 'Apple 지도에서 보기', `https://maps.apple.com/?q=${enc}&ll=${placeLa},${placeLo}`);
      // 구글맵: 좌표를 주면 '핀 고정 위치'로 떠서, 장소명으로 검색해 정식 명칭이 뜨게 한다
      const gDest = placeAddr ? encodeURIComponent(placeAddr)
        : ((placeName && placeName !== '약속 장소') ? enc : `${placeLa},${placeLo}`);
      btn('google', '구글지도로 안내', `https://www.google.com/maps/dir/?api=1&destination=${gDest}&travelmode=driving`);
      document.getElementById('resolved').textContent =
        (placeAddr ? placeAddr + ' · ' : '') + `좌표 ${placeLa.toFixed(5)}, ${placeLo.toFixed(5)}`;
    } else {
      missingEl = document.createElement('div');
      missingEl.className = 'missing';
      missingEl.textContent = '이 장소는 좌표를 찾지 못해 검색으로 엽니다. 지도에서 장소를 연 뒤 내비 버튼을 누르거나, 위에서 직접 검색해 보세요.';
      // btns 의 부모(#dest)에 넣어야 한다 — .wrap 기준으로 insertBefore 하면
      // btns 가 .wrap 의 직계 자식이 아니라서 NotFoundError 가 난다.
      btns.parentNode.insertBefore(missingEl, btns);
      btn('tmap', 'T맵에서 검색', `tmap://search?name=${enc}`);
      btn('naver', '네이버지도에서 검색', `https://map.naver.com/p/search/${enc}`);
      btn('kakaomap', '카카오맵에서 검색', `https://map.kakao.com/link/search/${enc}`);
      btn('apple', 'Apple 지도에서 검색', `https://maps.apple.com/?q=${enc}`);
      btn('google', '구글지도에서 검색', `https://www.google.com/maps/search/?api=1&query=${enc}`);
      document.getElementById('resolved').textContent = '';
    }
  }

  if (hasDest) {
    renderNav(name, la, lo, addr);
  } else {
    // 홈 화면 아이콘 실행 — 목적지 없이 검색 전용으로 시작
    document.getElementById('dest').hidden = true;
    document.getElementById('empty').hidden = false;
    document.querySelector('.search-hint').textContent =
      '지명·주소를 검색해 고르면 바로 안내가 시작됩니다.';
    document.getElementById('searchInput').placeholder = '지명·주소 검색';
    document.title = '길안내';
  }

  // --- 런처 자체 검색: OpenStreetMap Nominatim (키 필요 없음, 무료) ---
  // 검색해서 고른 결과로 renderNav 를 다시 불러 위 버튼들을 그 장소 기준으로 교체한다.
  const searchInput = document.getElementById('searchInput');
  const searchStatus = document.getElementById('searchStatus');
  const searchHint = document.getElementById('searchHint');
  const searchResults = document.getElementById('searchResults');
  let searchSeq = 0;

  function clearResults() {
    searchResults.innerHTML = '';
    searchResults.classList.remove('show');
  }

  // Nominatim 의 display_name 은 좁은 단위 → 넓은 단위 순서(영문권 방식)에
  // 우편번호·'대한민국'까지 붙어 길다. 한국식(넓은 → 좁은)으로 뒤집고
  // 군더더기를 떼서 '경기도 하남시 신장동 미사대로 750' 처럼 만든다.
  function tidyAddr(displayName, placeName) {
    const parts = displayName.split(',').map(s => s.trim()).filter(Boolean);
    const drop = new Set(['대한민국']);
    const kept = parts.filter((s, i) => {
      if (drop.has(s)) return false;
      if (/^\d{5}$/.test(s)) return false;            // 우편번호
      if (i === 0 && s === placeName) return false;   // 맨 앞 중복 상호명
      return true;
    });
    return kept.reverse().join(' ');
  }

  // ---------------- 최근 검색 ----------------
  // 검색어 문자열이 아니라 '고른 목적지(좌표까지)'를 저장한다.
  // 그래야 다시 누를 때 네트워크 검색 없이 즉시 내비 버튼을 띄울 수 있다.
  const RECENT_KEY = 'navi.recent.v1';
  const RECENT_MAX = 8;
  const recentBox = document.getElementById('recent');
  const recentList = document.getElementById('recentList');

  const recentKey = r => `${r.name}|${(+r.la).toFixed(4)},${(+r.lo).toFixed(4)}`;

  function loadRecent() {
    try {
      const v = JSON.parse(localStorage.getItem(RECENT_KEY));
      return Array.isArray(v) ? v.filter(r => r && r.name && isFinite(r.la) && isFinite(r.lo)) : [];
    } catch (_) { return []; }          // 사파리 프라이빗 모드 등에서 접근 거부될 수 있다
  }
  function saveRecent(list) {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX))); }
    catch (_) { /* 저장 실패해도 검색 자체는 계속 되게 둔다 */ }
  }
  function pushRecent(item) {
    const list = loadRecent().filter(r => recentKey(r) !== recentKey(item));
    list.unshift(item);
    saveRecent(list);
  }

  function renderRecent() {
    const list = loadRecent();
    recentList.innerHTML = '';
    if (!list.length) { recentBox.hidden = true; return; }
    list.forEach(r => {
      const row = document.createElement('div');
      row.className = 'recent-item';

      const pick = document.createElement('button');
      pick.type = 'button';
      pick.className = 'pick';
      pick.innerHTML = '<div class="rn"></div><div class="ra"></div>';
      pick.querySelector('.rn').textContent = r.name;
      pick.querySelector('.ra').textContent = r.addr || '';
      pick.addEventListener('click', () => {
        chooseDestination(r.name, r.la, r.lo, r.addr || '');
      });

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', `${r.name} 최근 검색에서 삭제`);
      del.addEventListener('click', () => {
        saveRecent(loadRecent().filter(x => recentKey(x) !== recentKey(r)));
        renderRecent();
      });

      row.append(pick, del);
      recentList.appendChild(row);
    });
    recentBox.hidden = false;
  }

  document.getElementById('recentClear').addEventListener('click', () => {
    saveRecent([]);
    renderRecent();
  });

  // ---------------- 집 · 사무실 ----------------
  // 등록은 별도 화면 없이 '검색해서 고른 목적지'를 그대로 저장하는 방식이다
  // (목적지 화면의 '집으로 저장' 버튼). 최근 검색과 같은 형태로 보관한다.
  const SAVED_KEYS = { home: 'navi.place.home', office: 'navi.place.office' };
  const SAVED_LABEL = { home: '집', office: '사무실' };
  // 조사: 받침 없거나 ㄹ 받침이면 '로', 그 외는 '으로' (사무실'로', 집'으로')
  const SAVED_TO = { home: '집으로', office: '사무실로' };

  // 이름 뒤 목적격 조사 을/를 — 한글이 아니면 안전하게 '을(를)'
  function objParticle(w) {
    const c = (w || '').charCodeAt((w || '').length - 1);
    if (!(c >= 0xAC00 && c <= 0xD7A3)) return '을(를)';
    return (c - 0xAC00) % 28 ? '을' : '를';
  }

  function loadSaved(kind) {
    try {
      const v = JSON.parse(localStorage.getItem(SAVED_KEYS[kind]));
      return (v && v.name && isFinite(v.la) && isFinite(v.lo)) ? v : null;
    } catch (_) { return null; }
  }
  function setSaved(kind, item) {
    try {
      if (item) localStorage.setItem(SAVED_KEYS[kind], JSON.stringify(item));
      else localStorage.removeItem(SAVED_KEYS[kind]);
    } catch (_) { /* 저장 못 해도 나머지는 계속 동작 */ }
  }

  // 지금 화면에 떠 있는 목적지 (좌표가 있을 때만)
  let currentDest = null;

  function sameSpot(a, b) {
    return !!a && !!b && a.name === b.name
      && Math.abs(a.la - b.la) < 1e-4 && Math.abs(a.lo - b.lo) < 1e-4;
  }

  const chipHome = document.getElementById('chipHome');
  const chipOffice = document.getElementById('chipOffice');
  const saveBar = document.getElementById('saveBar');
  const saveHomeBtn = document.getElementById('saveHome');
  const saveOfficeBtn = document.getElementById('saveOffice');

  function renderQuickbar() {
    chipHome.classList.toggle('unset', !loadSaved('home'));
    chipOffice.classList.toggle('unset', !loadSaved('office'));
  }

  function renderSaveBar() {
    if (!currentDest) { saveBar.hidden = true; return; }
    saveBar.hidden = false;
    [['home', saveHomeBtn], ['office', saveOfficeBtn]].forEach(([kind, btn]) => {
      const on = sameSpot(loadSaved(kind), currentDest);
      btn.textContent = on ? `${SAVED_LABEL[kind]} 등록됨 · 해제`
                           : `${SAVED_TO[kind]} 저장`;
      btn.classList.toggle('on', on);
    });
  }

  [['home', saveHomeBtn], ['office', saveOfficeBtn]].forEach(([kind, btn]) => {
    btn.addEventListener('click', () => {
      if (!currentDest) return;
      const on = sameSpot(loadSaved(kind), currentDest);
      setSaved(kind, on ? null : currentDest);
      searchStatus.textContent = on
        ? `${SAVED_LABEL[kind]} 등록을 해제했습니다.`
        : `'${currentDest.name}'${objParticle(currentDest.name)} ${SAVED_TO[kind]} 저장했습니다.`;
      renderQuickbar();
      renderSaveBar();
    });
  });

  // 등록 대기 상태 — 미등록 칩을 누르면 '다음에 고르는 장소'가 그 칸에 저장된다.
  // 칩을 눌러 바로 등록하는 게 사람들이 가장 먼저 시도하는 동작이라 이걸 지원한다
  // (2026-08-17 사용자 피드백: '집 사무실 등록이 안됨').
  let pendingSave = null;

  function setPending(kind) {
    pendingSave = kind;
    searchHint.textContent = kind
      ? `${SAVED_TO[kind]} 등록할 장소를 검색해 고르세요. (다시 누르면 취소)`
      : '검색해서 고르면 아래 목적지가 그 장소로 바뀝니다.';
    chipHome.classList.toggle('pending', kind === 'home');
    chipOffice.classList.toggle('pending', kind === 'office');
  }

  [['home', chipHome], ['office', chipOffice]].forEach(([kind, chip]) => {
    chip.addEventListener('click', () => {
      if (pendingSave === kind) { setPending(null); searchStatus.textContent = ''; return; }
      const saved = loadSaved(kind);
      if (saved) { setPending(null); chooseDestination(saved.name, saved.la, saved.lo, saved.addr || ''); return; }
      setPending(kind);                 // 미등록 → 등록 모드로 들어간다
      searchStatus.textContent = '';
      searchInput.focus();
    });
  });

  // 목적지 확정 — 검색 결과·최근 검색·집/사무실 모두 여기로 모인다
  function chooseDestination(placeName, placeLa, placeLo, placeAddr) {
    renderNav(placeName, placeLa, placeLo, placeAddr);
    const item = { name: placeName, la: +placeLa, lo: +placeLo, addr: placeAddr || '' };
    currentDest = isFinite(item.la) && isFinite(item.lo) ? item : null;
    pushRecent(item);

    // 등록 모드로 들어와 있었다면 고른 장소를 그 칸에 바로 저장한다
    let savedMsg = '';
    if (pendingSave && currentDest) {
      setSaved(pendingSave, currentDest);
      savedMsg = `'${item.name}'${objParticle(item.name)} ${SAVED_TO[pendingSave]} 저장했습니다.`;
      setPending(null);
      renderQuickbar();
    }

    clearResults();
    recentBox.hidden = true;
    searchStatus.textContent = savedMsg;
    searchInput.value = '';
    searchInput.blur();                 // 키보드 내려서 버튼이 가려지지 않게
    renderSaveBar();
    document.getElementById('place').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------------- 검색 (입력하는 즉시, 디바운스) ----------------
  const MIN_CHARS = 2;      // 1글자는 후보가 너무 많고 Nominatim 부담도 크다
  const DEBOUNCE_MS = 450;  // Nominatim 이용 정책상 초당 1회 이하로 유지
  let debounceTimer = null;

  async function runSearch(query) {
    const q = (query || '').trim();
    if (!q) return;
    const mySeq = ++searchSeq;
    searchStatus.textContent = '검색 중…';
    let list = [];
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1'
        + '&countrycodes=kr&accept-language=ko&limit=8&q=' + encodeURIComponent(q);
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (mySeq !== searchSeq) return; // 그 사이 새 검색이 시작됐으면 이 결과는 버린다
      if (!res.ok) throw new Error('HTTP ' + res.status);
      list = await res.json();
    } catch (err) {
      if (mySeq !== searchSeq) return;
      clearResults();
      searchStatus.textContent = '검색 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      return;
    }

    clearResults();
    list.forEach(item => {
      const row = document.createElement('button');
      row.type = 'button';
      const display = (item.name && item.name.trim()) || item.display_name.split(',')[0];
      const addrText = tidyAddr(item.display_name, display);
      row.innerHTML = `<div class="rname"></div><div class="raddr"></div>`;
      row.querySelector('.rname').textContent = display;
      row.querySelector('.raddr').textContent = addrText;
      row.addEventListener('click', () => {
        chooseDestination(display, parseFloat(item.lat), parseFloat(item.lon), addrText);
      });
      searchResults.appendChild(row);
    });

    if (list.length) {
      searchResults.classList.add('show');
      searchStatus.textContent = '';
    } else {
      // 0건일 때만 지도앱으로 넘겨준다. Nominatim(OSM)에는 '인천혼다' 같은
      // 국내 소상공인 상호가 대부분 없어서, 이게 없으면 막다른 길이 된다.
      searchStatus.textContent = `'${q}' 좌표를 못 찾았습니다 — 지도앱에서 열어 보세요.`;
      appendMapAppLinks(q);
    }
  }

  // 지도앱 바로 검색 링크 (검색 결과 0건일 때만 사용).
  // 브라우저에서 카카오 지도 검색 API 는 CORS 로 막혀 직접 못 부른다.
  function appendMapAppLinks(q) {
    const encQ = encodeURIComponent(q);
    [
      ['카카오맵', `https://map.kakao.com/link/search/${encQ}`],
      ['네이버지도', `https://map.naver.com/p/search/${encQ}`],
      ['T맵', `tmap://search?name=${encQ}`],
      ['구글지도', `https://www.google.com/maps/search/?api=1&query=${encQ}`],
    ].forEach(([label, href]) => {
      const a = document.createElement('a');
      a.href = href;
      a.className = 'maplink';
      a.textContent = `${label}에서 '${q}' 검색`;
      searchResults.appendChild(a);
    });
    searchResults.classList.add('show');
  }

  function onInput() {
    const q = searchInput.value.trim();
    clearTimeout(debounceTimer);
    if (q.length < MIN_CHARS) {
      searchSeq++;                      // 진행 중이던 검색 결과가 뒤늦게 붙는 것 방지
      clearResults();
      searchStatus.textContent = '';
      if (!q) renderRecent();           // 다 지우면 최근 검색을 다시 보여준다
      return;
    }
    recentBox.hidden = true;
    debounceTimer = setTimeout(() => runSearch(q), DEBOUNCE_MS);
  }

  searchInput.addEventListener('input', onInput);
  searchInput.addEventListener('search', onInput);   // iOS 검색창 × 버튼
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {            // 즉시 검색하고 키보드 내리기
      e.preventDefault();
      clearTimeout(debounceTimer);
      searchInput.blur();
      const q = searchInput.value.trim();
      if (q.length >= MIN_CHARS) runSearch(q);
    }
  });

  // ---------------- 처음으로(초기화) ----------------
  function goHome() {
    clearTimeout(debounceTimer);
    searchSeq++;
    setPending(null);                   // 등록 대기도 함께 취소
    searchInput.value = '';
    clearResults();
    searchStatus.textContent = '';
    if (hasDest) {
      // 링크로 열린 경우엔 링크의 원래 목적지로 되돌린다(앱 초기화와 구분)
      renderNav(name, la, lo, addr);
      currentDest = (isFinite(la) && isFinite(lo))
        ? { name, la: +la, lo: +lo, addr: addr || '' } : null;
    } else {
      document.getElementById('dest').hidden = true;
      document.getElementById('empty').hidden = false;
      document.title = '길안내';
      currentDest = null;
    }
    renderRecent();
    renderSaveBar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('chipReset').addEventListener('click', goHome);

  // 앱 모드에서 내비 앱에 다녀오면(백그라운드 후 복귀) 첫 화면으로 되돌린다.
  // 링크로 연 경우는 약속 장소를 유지해야 하므로 건드리지 않는다.
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hasDest) return;
    // 잠깐 가려진 정도(알림 배너 등)로는 초기화하지 않는다
    if (hiddenAt && Date.now() - hiddenAt > 1500) goHome();
    hiddenAt = 0;
  });

  // 좌표를 못 찾은 채로 열린 경우, 원래 장소명으로 미리 검색해 후보를 바로 보여준다
  // (자동으로 목적지를 바꾸지는 않는다 — 사용자가 목록에서 직접 골라야 바뀐다).
  if (hasDest && !(isFinite(la) && isFinite(lo)) && name && name !== '약속 장소') {
    searchInput.value = name;
    runSearch(name);
  } else if (!hasDest) {
    renderRecent();
  }

  // 링크로 열려 좌표까지 있는 경우엔 그 장소를 집/사무실로 저장할 수 있게 해 둔다
  if (hasDest && isFinite(la) && isFinite(lo)) {
    currentDest = { name, la: +la, lo: +lo, addr: addr || '' };
  }
  renderQuickbar();
  renderSaveBar();
</script>

</body>
</html>
