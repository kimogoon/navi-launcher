<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COFFEE RUN">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="전국 바이크 카페와 정비·딜러망을 한 화면에서 찾고 바로 길안내로 넘긴다.">
<!-- 홈화면 추가용 아이콘. 이게 없으면 iOS 가 페이지 스크린샷을 축소해 아이콘으로 쓴다 -->
<link rel="apple-touch-icon" href="./coffee-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./coffee-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./coffee-512.png">
<link rel="manifest" href="./coffee-android.webmanifest">
<title>COFFEE RUN</title>
<style>
:root{
  --ink:#101014; --red:#E10600;
  --bg:#F6F5F3; --surface:#fff; --raised:#FAF9F8;
  --line:#E2DFDE; --line2:#EFECEB;
  --fg:#16151A; --fg2:#57525A; --fg3:#8C868F;
  --keep:#12795A; --keep-bg:#E4F2EC;
  --open:#12864F; --shut:#C4342B;
  --fuel:#1F5FA8; --fuel-bg:#E5EEF9;
  --gear:#7A4BB5;
  --warn:#8A6100; --warn-bg:#FBF0D8;
  /* 활성 상태는 배경 대비로만 판단하면 다크에서 뒤집힌다(--ink 가 배경보다 어두움).
     테마마다 '배경의 반대쪽'을 명시해 어느 쪽에서도 확실히 튀게 한다. */
  --on-bg:#101014; --on-fg:#FFFFFF;
  --sel-bg:#ECEAE8; --sel-fg:#16151A; --sel-line:#BDB8B5;
  --red-bg:#FDEBEA; --red-fg:#B00500; --red-line:#F0B5B2;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0C0C0F; --surface:#16161B; --raised:#1D1D23;
  --line:#2A2A32; --line2:#212129;
  --fg:#F0EEF2; --fg2:#ACA7B1; --fg3:#79747F;
  --keep:#4FD1A5; --keep-bg:#0F2D24;
  --open:#34C48A; --shut:#FF6A5E;
  --fuel:#7FB4EE; --fuel-bg:#12233A;
  --gear:#B78BE8;
  --warn:#E5B04A; --warn-bg:#2E2412;
  --on-bg:#F2F0F4; --on-fg:#101014;
  --sel-bg:#2A2A33; --sel-fg:#F0EEF2; --sel-line:#4A4A57;
  --red-bg:#2C1416; --red-fg:#FF7A72; --red-line:#5C2A28;
}}
:root[data-theme=dark]{
  --bg:#0C0C0F; --surface:#16161B; --raised:#1D1D23;
  --line:#2A2A32; --line2:#212129;
  --fg:#F0EEF2; --fg2:#ACA7B1; --fg3:#79747F;
  --keep:#4FD1A5; --keep-bg:#0F2D24;
  --open:#34C48A; --shut:#FF6A5E;
  --fuel:#7FB4EE; --fuel-bg:#12233A;
  --gear:#B78BE8;
  --warn:#E5B04A; --warn-bg:#2E2412;
  --on-bg:#F2F0F4; --on-fg:#101014;
  --sel-bg:#2A2A33; --sel-fg:#F0EEF2; --sel-line:#4A4A57;
  --red-bg:#2C1416; --red-fg:#FF7A72; --red-line:#5C2A28;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{
  font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{
  max-width:760px;margin:0 auto;padding:20px 16px 40px;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
/* 제목·검색·카테고리·퀵바는 위에 붙어 있고 목록만 그 아래로 흐른다.
   position:fixed 가 아니라 sticky 인 이유 — 좌우 여백과 max-width 를 .wrap 에서 그대로 물려받고,
   아이폰 주소창이 접혔다 펴질 때 높이가 튀지 않는다.

   상단 여백을 음수 마진으로 걷어내고 같은 크기를 padding 으로 되돌린다.
   그래야 스크롤한 내용이 헤더 위쪽 빈 칸으로 비쳐 보이지 않는다. */
.head{
  position:sticky;top:0;z-index:30;background:var(--bg);
  margin:-20px -16px 0;padding:20px 16px 6px;
  border-bottom:1px solid transparent;
}
.head.stuck{border-bottom-color:var(--line);
  box-shadow:0 10px 18px -14px rgba(0,0,0,.55)}
/* 화면이 짧으면(가로로 눕히거나 작은 기기) 헤더가 화면을 다 먹을 수 있다.
   그런 경우에만 헤더 안쪽이 스크롤되게 해 목록이 사라지는 일을 막는다. */
@media (max-height:620px){
  .head{max-height:64dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
}
.crumbs{padding-top:10px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--red);font-weight:700;text-transform:uppercase}
h1{
  margin:6px 0 14px;font-size:clamp(28px,7vw,40px);font-weight:900;
  letter-spacing:-.035em;font-style:italic;
}
h1 small{display:block;font:600 12px/1.4 var(--sans);letter-spacing:.02em;
  font-style:normal;color:var(--fg3);margin-top:5px}
/* Notice — 제목 바로 아래. FURYCLASSIC 워드마크가 기울어 있어 태그도 같은 각도로 눕힌다.
   빨강은 이 페이지에서 브랜드 자리에만 쓰는 색이라, 여기 한 칸만 채우고 글은 회색으로 둔다. */
.notice{display:flex;align-items:center;gap:9px;margin:-4px 0 14px;
  font:600 12.5px/1.5 var(--sans);color:var(--fg2);letter-spacing:.005em}
.notice b{flex:none;padding:5px 9px;border-radius:4px;background:var(--red);color:#fff;
  font:900 10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;
  transform:skewX(-9deg);box-shadow:0 1px 0 rgba(0,0,0,.25)}
/* 작업 중이라는 신호 — 숨쉬듯 아주 느리게. 움직임을 꺼 둔 사람에게는 그냥 점이다 */
.notice i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--red);
  animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.28;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.notice i{animation:none;opacity:.75}}
.search-wrap{position:relative;margin-bottom:10px}
.search-input{
  width:100%;font-size:16px;font-family:var(--sans);padding:12px 40px 12px 14px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
}
.search-input:focus{outline:2px solid var(--red);outline-offset:1px}
.clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--fg3);font-size:19px;cursor:pointer;
  width:30px;height:30px;border-radius:50%;
}
/* 선택줄은 전부 좌우로 흐른다. 세로로 움직이는 건 목록뿐이다.
   예전에는 칩이 줄바꿈돼 카테고리를 바꿀 때마다 헤더 높이가 한 줄씩 들썩였다 —
   고정 헤더에서 그건 화면이 튀는 것으로 보인다.

   고른 칩은 색을 꽉 채운다. 한 줄이라 진하게 칠해도 무겁지 않고,
   달리다 잠깐 보는 화면에서는 옅은 바탕보다 이쪽이 훨씬 빨리 읽힌다. */
.seg{display:flex;flex-wrap:nowrap;gap:7px;margin-bottom:10px;
  overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:0 0 auto;scroll-snap-align:start;
  font:900 15px/1 var(--sans);font-style:italic;letter-spacing:-.025em;
  padding:11px 15px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--fg2);
  white-space:nowrap;transition:background .14s ease, color .14s ease;
}
.seg button[aria-pressed=true]{
  background:var(--on-bg);border-color:transparent;color:var(--on-fg)}
/* 지금 보고 있는 카테고리는 브랜드 색으로 — 한눈에 어디에 있는지 알 수 있게 */
#modeSeg button[aria-pressed=true]{background:var(--red);border-color:transparent;color:#fff}
#modeSeg button[aria-pressed=true] .n{color:#fff;opacity:.72}
.seg button[aria-pressed=true] .n{color:var(--on-fg);opacity:.6}
.seg .n{opacity:.5;margin-left:6px;font-style:normal;font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--fg3)}
/* 경로는 눌러서 되돌아가는 곳이지 강조할 곳이 아니다.
   빨강은 브랜드색이라 여기 쓰면 화면에서 가장 먼저 눈에 띈다 — 밑줄로만 누를 수 있음을 알린다. */
.crumbs button{
  border:0;background:transparent;color:var(--fg2);font:600 13px/1 var(--sans);cursor:pointer;
  padding:2px 0;display:inline-flex;align-items:center;gap:5px;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)
}
.crumbs button:active{color:var(--fg)}
/* 제목이 곧 '처음으로' 다 — 아이폰에서 엄지가 가장 먼저 닿는 자리라 버튼을 따로 두지 않는다 */
.home-title{
  border:0;background:transparent;padding:0;margin:0;cursor:pointer;color:inherit;
  font:inherit;letter-spacing:inherit;font-style:inherit;-webkit-tap-highlight-color:transparent
}
.home-title:active{opacity:.55}
.home-setup{border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:14px;display:flex;flex-direction:column;gap:10px}
.home-setup p{margin:0;font-size:13px;color:var(--fg3);line-height:1.55}
.home-setup input{width:100%;font-size:16px;font-family:var(--sans);padding:11px 13px;
  border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg)}
.home-setup .go{font:700 14px/1 var(--sans);padding:13px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--raised);color:var(--fg)}
.home-setup .go.pri{background:var(--on-bg);color:var(--on-fg);border-color:transparent}
.panel .hint{margin:0;font-size:12px;line-height:1.55;color:var(--fg3)}
.home-edit{align-self:flex-start;border:0;background:transparent;padding:4px 0;cursor:pointer;
  color:var(--fg2);font:600 12.5px/1 var(--sans);text-decoration:underline;text-underline-offset:3px}
/* ── RUN 버튼과 지역 레일 ────────────────────────────────
   지역을 격자로 깔면 카테고리를 바꿀 때마다 화면 절반이 타일로 찬다.
   버튼 하나로 접어 두고, 열면 큰 카드가 좌우로 흐른다.
   장갑 낀 손으로도 누를 수 있게 카드를 크게 잡았다. */
/* 카테고리 칩과 같은 알약 모양 · 같은 글꼴. 폭만 전체를 쓴다 —
   이 줄이 '지금 무엇을 고르는 중인가' 를 말하는 자리라 가장 크다. */
/* 글자와 화살표를 가운데에 한 덩어리로 붙인다.
   양끝으로 벌려 놓으면 가운데가 텅 비어 버튼 하나가 아니라 빈 바처럼 보인다. */
.runbtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:19px 20px;border-radius:999px;cursor:pointer;
  border:0;background:var(--on-bg);color:var(--on-fg);
  font:900 24px/1 var(--sans);font-style:italic;letter-spacing:-.045em;
  text-transform:uppercase;
}
.runbtn:active{opacity:.82}
.runbtn .rl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.runbtn .rc{flex:none;width:11px;height:11px;border-right:3px solid var(--on-fg);
  border-bottom:3px solid var(--on-fg);transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .18s ease;opacity:.75}
/* 펼치면 뒤집는다 — 지금 고르는 중이라는 표시. 채운 버튼이라 색을 빼는 쪽이 눈에 띈다 */
.runbtn[aria-expanded=true]{background:transparent;color:var(--fg);
  box-shadow:inset 0 0 0 2px var(--fg)}
.runbtn[aria-expanded=true] .rc{border-color:var(--fg);
  transform:rotate(-135deg) translate(-3px,-3px)}

/* 좌우 스크롤 — 카드가 화면 한가운데에 딱 멈춘다.
   scroll-snap-stop:always 가 없으면 세게 튕겼을 때 여러 장을 지나쳐 늘어진다.
   양옆 여백은 첫 장과 마지막 장도 가운데로 올 수 있게 카드 절반만큼 준다. */
.rail{display:flex;gap:11px;margin-top:9px;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:2px calc(50% - 110px) 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:0 0 220px;height:104px;scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);border-radius:15px;background:var(--surface);
  color:var(--fg);cursor:pointer;font-family:var(--sans);
  transition:border-color .15s ease, background .15s ease}
.rcard b{font:900 24px/1.1 var(--sans);font-style:italic;letter-spacing:-.035em;
  text-align:center;word-break:keep-all;padding:0 10px}
/* 브랜드 카드는 제조사 색을 그대로 입는다 — 글자만으로도 어느 브랜드인지 바로 안다 */
.rcard.rbrand b{font-size:20px}
.rcard.rbrand[aria-current=true]{box-shadow:inset 0 0 0 3px var(--on-bg)}
.rcard[aria-current=true]{background:var(--on-bg);border-color:transparent}
.rcard[aria-current=true] b{color:var(--on-fg)}
.rcard.rbrand[aria-current=true] b{color:inherit}
.rcard:active{border-color:var(--fg3)}
@media (prefers-reduced-motion:reduce){.rail{scroll-behavior:auto}.runbtn .rc{transition:none}}
/* ── 첫 화면 ──────────────────────────────────────────
   목록을 깔지 않는다. 큰 원 하나와 날씨, 그리고 담아 둔 곳만.
   달리기 전에 알고 싶은 건 '어디로 갈까' 와 '지금 밖이 어떤가' 둘뿐이다. */
.landing{display:flex;flex-direction:column;align-items:center;gap:14px;padding:2px 0 4px}
/* 화면 폭을 거의 다 쓴다. 장갑 낀 손으로 눌러야 하고, 첫 화면에서 유일한 목적지다. */
.runbig{
  width:min(88vw,420px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:var(--on-bg);color:var(--on-fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--sans);
  box-shadow:0 22px 50px -26px rgba(0,0,0,.85);
  transition:transform .12s ease;
  overflow:hidden;              /* 안쪽 스트립이 원 밖으로 새면 동그라미가 깨진다 */
}
.runbig:active{transform:scale(.975)}
/* 비·눈·뇌우면 원 전체가 빨강이 된다. 노면이 젖었다는 건 오늘 나갈지 말지를 가르는 신호라,
   글씨 몇 자보다 화면을 통째로 바꾸는 편이 확실하다. */
.runbig.wet{background:var(--red);color:#fff;box-shadow:0 22px 50px -24px rgba(225,6,0,.75)}
.runbig.wet .wx .d b{color:#fff;opacity:.95}
.runbig.wet .wx .d span,.runbig.wet .rs{opacity:.66}
/* 나이키·애플워치 러닝 페이스의 어법 — 아주 굵고 살짝 눕고 자간을 바짝 조인 대문자.
   가로로 조금 늘려(scaleX) 폭을 채운다. 시스템 폰트에는 넓은 굵기가 없어 변형으로 낸다. */
/* 원 안 글자는 RUN 을 기준으로 삼는다. 브랜드도 GEAR 도 GAS STATION 도 같은 규칙 —
   길수록 한 단계씩 줄여서 어떤 말이 와도 원 안에 담긴다. */
.runbig .rw, .bstrip > span{
  font:900 clamp(56px,19vw,96px)/.92 var(--sans);font-style:italic;
  letter-spacing:-.07em;text-transform:uppercase;
  transform:scaleX(1.06);transform-origin:center;
  text-align:center;word-break:keep-all;
}
.runbig [data-len="2"]{font-size:clamp(34px,11.5vw,58px)}
.runbig [data-len="3"]{font-size:clamp(24px,8vw,40px)}
.runbig [data-len="4"]{font-size:clamp(18px,6vw,30px)}

/* SHOP — 원은 가만히 있고 브랜드 이름만 좌우로 흐른다.
   원이 통째로 움직이면 시선이 따라다녀야 해서 어지럽다. 창은 고정, 내용만 넘긴다. */
.bstrip{
  width:100%;display:flex;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.bstrip::-webkit-scrollbar{display:none}
.bstrip > span{
  flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center;padding:0 9%;
}
/* 좌우에 더 있다는 표시 — 화살표 대신 원 안쪽을 살짝 어둡게 해서 넘길 게 있음을 알린다 */
.bwin{position:relative;width:100%;display:flex;align-items:center}
.bwin::before,.bwin::after{content:"";position:absolute;top:0;bottom:0;width:13%;
  pointer-events:none;z-index:1}
.bwin::before{left:0;background:linear-gradient(90deg,var(--on-bg),transparent)}
.bwin::after{right:0;background:linear-gradient(270deg,var(--on-bg),transparent)}
.runbig.wet .bwin::before{background:linear-gradient(90deg,var(--red),transparent)}
.runbig.wet .bwin::after{background:linear-gradient(270deg,var(--red),transparent)}

/* 원을 감싼 얇은 링 — 애플워치 다이얼처럼 원이 혼자 뜨지 않게 잡아 준다 */
.runring{position:relative;display:flex;align-items:center;justify-content:center;
  padding:10px;border-radius:50%;border:2px solid var(--line)}

/* 날씨는 원 안에 — 달리기 전에 보는 것 둘(어디로 갈까·밖이 어떤가)이 한자리에 있다 */
.runbig .wx{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--on-fg)}
.runbig .wx svg{width:clamp(24px,7vw,34px);height:clamp(24px,7vw,34px);flex:none;opacity:.9}
.runbig .wx .t{font:900 clamp(24px,7.4vw,36px)/1 var(--sans);font-style:italic;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.runbig .wx .d{display:flex;flex-direction:column;gap:2px;text-align:left}
.runbig .wx .d b{font:700 clamp(10px,2.9vw,12.5px)/1 var(--sans);opacity:.78}
.runbig .wx .d span{font:600 clamp(9px,2.5vw,11px)/1 var(--sans);opacity:.5}
.runbig .wx.warn .d b{color:#FFC94A;opacity:1}
.runring:has(.runbig.wet){border-color:rgba(225,6,0,.45)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tiles-wide{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
/* 브랜드 타일 — 영문 워드마크가 버튼을 채운다 */
.tile-wm{height:74px;padding:8px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;position:relative;
  border-color:rgba(0,0,0,.18)}
.tile-wm b{font-weight:900;font-style:italic;letter-spacing:-.02em;
  line-height:1.08;text-align:center;word-break:keep-all;display:block}
.tile-wm-n{position:absolute;right:6px;bottom:5px;font:700 10px/1 var(--sans);
  opacity:.72;font-variant-numeric:tabular-nums}
.tiles-wide .tile b{font-size:14px;word-break:keep-all}
.tile{
  border:1px solid var(--line);background:var(--surface);border-radius:11px;
  padding:13px 10px;cursor:pointer;text-align:center;color:var(--fg);font-family:var(--sans);
}
.tile{position:relative}
.tile b{display:block;font-size:15px;font-weight:700}
/* 권역 타일은 7개뿐이라 이름을 키운다. 시군구 타일보다 한 단계 위라는 표시이기도 하다.
   색으로 구분하지 않는다 — 지역명에 색을 쓰면 링크로 오인된다. */
.tile-region b{font-size:18px;letter-spacing:-.02em}
.tile span{font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.more{width:100%;margin-top:10px;padding:14px;border-radius:12px;cursor:pointer;
  border:1px dashed var(--line);background:transparent;color:var(--fg2);
  font:800 14px/1 var(--sans);font-style:italic;letter-spacing:-.02em}
.more:active{background:var(--raised)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.card-head{display:flex;gap:10px;padding:13px 14px;cursor:pointer;align-items:flex-start}
/* 왼쪽 색 막대 = 지금 문이 열려 있는가.
   초록 영업 중 · 빨강 영업 종료(오늘 휴무 포함) · 회색 시간표 없음.
   가게가 종류마다 다른 색이던 걸 걷어냈다 — 라이더가 카드에서 가장 먼저 알고 싶은 건
   '무슨 카테고리인가' 가 아니라 '지금 가면 문이 열려 있나' 다. */
.bar{width:4px;border-radius:2px;flex:none;align-self:stretch;background:var(--fg3)}
.card[data-open="1"] .bar{background:var(--open)}
.card[data-open="0"] .bar{background:var(--shut)}
.cov{font-size:11.5px;color:var(--fg3)}
.card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card-name{font-weight:700;font-size:16px;letter-spacing:-.01em;word-break:keep-all}
.card-name s{color:var(--warn)}
.card-addr{font-size:12.5px;color:var(--fg3);word-break:keep-all}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.b{font:600 11px/1 var(--sans);padding:4px 7px;border-radius:5px;background:var(--raised);
   color:var(--fg2);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.b.ok{background:var(--keep-bg);color:var(--keep);border-color:transparent}
.b.fu{background:var(--fuel-bg);color:var(--fuel);border-color:transparent}
.b.wn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
/* 색 막대만으로는 색각 이상이 있으면 읽히지 않는다 — 말로도 적는다 */
.b.op{background:var(--keep-bg);color:var(--open);border-color:transparent;font-weight:700}
.b.cl{background:var(--red-bg);color:var(--shut);border-color:transparent;font-weight:700}
.dist{font:700 12px/1 var(--sans);color:var(--fg3);flex:none;padding-top:3px;font-variant-numeric:tabular-nums}
.panel{border-top:1px solid var(--line2);padding:13px 14px;display:none;flex-direction:column;gap:11px}
.card.open .panel{display:flex}
.rows{display:flex;flex-direction:column;gap:5px;font-size:13px}
.row{display:grid;grid-template-columns:64px 1fr;gap:9px}
.row dt{color:var(--fg3);font-size:12px}
.row dd{margin:0;color:var(--fg)}
.menu{display:flex;flex-wrap:wrap;gap:5px}
.menu span{font:500 11.5px/1 var(--sans);padding:5px 8px;border-radius:6px;
  background:var(--raised);border:1px dashed var(--line);color:var(--fg2);font-variant-numeric:tabular-nums}
.gas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.gas li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;
  padding:6px 9px;border-radius:7px;background:var(--raised);font-size:12.5px;font-variant-numeric:tabular-nums}
.gas .p{font-weight:700}
.gas .x{grid-column:1/-1;color:var(--fuel);font-weight:700;font-size:11.5px}
.links{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.links a{color:var(--fg);font-weight:600;text-underline-offset:3px}
.links a.ig{color:var(--red)}
/* 기본은 두 칸. 주유소처럼 셋뿐인 카드는 세 칸으로 한 줄에 놓는다 —
   2+1 로 접히면 마지막 하나가 남아 어색하다. */
.btns{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.btns.n3{grid-template-columns:1fr 1fr 1fr}
.btns a,.btns button{
  display:block;text-align:center;text-decoration:none;font:700 13px/1 var(--sans);
  padding:12px 6px;border-radius:9px;border:1px solid var(--line);cursor:pointer;
  background:var(--surface);color:var(--fg);font-family:var(--sans);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 세 칸이면 글자가 좁아진다 — 크기를 조금 줄이고 여백을 당긴다 */
.btns.n3 a,.btns.n3 button{font-size:12px;padding:12px 4px;letter-spacing:-.02em}
/* .btns a 가 (0,1,1) 이라 .n-tmap (0,1,0) 을 이겨버린다 — 반드시 .btns 를 앞에 붙일 것.
   색상은 길안내 런처(index.html)와 동일하게 맞춘다. */
.btns .n-tmap  {background:#0264FB;color:#fff;border-color:#0257D8}
.btns .n-naver {background:#03C75A;color:#fff;border-color:#02AD4E}
.btns .n-kakao {background:#FAE100;color:#191600;border-color:#E8D100}
.btns .n-kmap  {background:#E08A52;color:#1A1D21;border-color:#C97740}
.btns .n-apple {background:#F2F2F4;color:#1D1D1F;border-color:#D6D6DB}
.btns .n-google{background:#8A8078;color:#1A1D21;border-color:#736A63}
.empty{padding:44px 0;text-align:center;color:var(--fg3);font-size:14px}
/* 브랜드 서명 — 길안내 런처와 동일. 워드마크는 패스 변환된 인라인 SVG라
   폰트 설치와 무관하게 같게 보이고 currentColor 로 다크/라이트 자동 대응. */
.brand{margin:auto 0 0;padding-top:22px;text-align:center;flex:none}
.brand-cut{display:block;width:54px;height:4px;margin:0 auto 13px;
  background:var(--red);transform:skewX(-18deg);border-radius:1px}
.wordmark{display:block;width:min(200px,58%);height:auto;margin:0 auto;color:var(--fg2)}
.slogan{margin:9px 0 0;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg3)}
/* 입력창 안쪽 버튼 — 비어 있으면 붙여넣기, 글자가 있으면 지우기 */
.io{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;background:transparent;cursor:pointer;
  color:var(--fg3);display:flex;align-items:center;justify-content:center;border-radius:50%}
.io svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:none}
.io.is-paste .ic-paste{display:block}
.io.is-clear .ic-clear{display:block}
.pin{border:0;background:transparent;cursor:pointer;color:var(--fg3);
  font-size:17px;line-height:1;padding:2px 4px;flex:none}
.pin.on{color:var(--red)}
/* 내 주변·즐겨찾기·처음으로 아이콘 바 — 길안내 런처의 .quickbar/.chip 과 같은 형식 */

/* 브랜드 배지 — 제조사 로고는 등록상표라 쓰지 않는다.
   각 브랜드를 연상시키는 색과 약자만으로 만든 자체 표식이다.
   색은 공개적으로 알려진 톤에 맞추되, 배지끼리 구분되도록 명도를 조정했다. */
.bdg{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:34px;height:34px;border-radius:50%;font:800 11px/1 var(--sans);
  letter-spacing:-.02em;border:1px solid rgba(0,0,0,.16);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);}
.bdg.sm{width:24px;height:24px;font-size:8.5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.tile .bdg{margin:0 auto 7px}
.tile-brand{display:flex;flex-direction:column;align-items:center}
.card-name-row{display:flex;align-items:center;gap:7px;min-width:0}
.card-name-row .card-name{min-width:0;overflow:hidden;text-overflow:ellipsis}

.bdg.bm0{background:#157A6E;color:#FFFFFF}
.bdg.bm1{background:#4A4E69;color:#FFFFFF}
.bdg.bm2{background:#1B2A78;color:#FFFFFF}
.bdg.bm3{background:#1F86D0;color:#FFFFFF}
.bdg.bm4{background:#6EA204;color:#12160C}
.bdg.bm5{background:#E2571E;color:#16130F}
.bdg.bm6{background:#0066B1;color:#FFFFFF}
.bdg.bm7{background:#A67C3D;color:#191510}
.bdg.bm8{background:#FF9500;color:#16130F}
.bdg.bm9{background:#6E1F1F;color:#FFFFFF}
.bdg.bm10{background:#A81217;color:#FFFFFF}
.bdg.bm11{background:#E60012;color:#FFFFFF}
.bdg.bm12{background:#1C1C1C;color:#FFFFFF}
.bdg.bm13{background:#6FB3A0;color:#12160C}
.bdg.bm14{background:#111827;color:#F97316}
.bdg.bm15{background:#0E3A5F;color:#7FD1E8}
.bdg.bm16{background:#0F6E78;color:#FFFFFF}
.nearbar{display:none;gap:7px;margin:0 0 10px;overflow-x:auto;
  scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:2px}
.nearbar::-webkit-scrollbar{display:none}
.nearbar.on{display:flex;flex-wrap:nowrap}
.nearbar button{flex:0 0 auto;scroll-snap-align:start;
  font:900 14px/1 var(--sans);font-style:italic;letter-spacing:-.02em;
  padding:10px 14px;border-radius:999px;white-space:nowrap;
  cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg2)}
.nearbar button[aria-pressed=true]{
  background:var(--on-bg);border-color:transparent;color:var(--on-fg)}
.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.qchip{flex:1 1 22%;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 4px;border:1px solid var(--line);border-radius:12px;cursor:pointer;
  background:var(--surface);color:var(--fg);font:500 11px/1 var(--sans)}
/* 되돌아갈 자리가 없으면 눌리지 않는다는 걸 보이게 한다 — 눌러도 아무 일이 없으면 고장으로 읽힌다 */
.qchip[disabled]{opacity:.34;cursor:default}
.qchip svg{width:21px;height:21px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qchip:active{background:var(--raised)}
.qchip[aria-pressed=true]{background:var(--red-bg);border-color:var(--red-line);color:var(--red-fg)}
.qchip.busy{opacity:.6}
.recent-wrap{margin-bottom:10px}
.recent-wrap h2{font:700 11px/1 var(--sans);letter-spacing:.13em;color:var(--fg3);
  text-transform:uppercase;margin:0 0 7px}
button:focus-visible,a:focus-visible,.tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      style="background:${bg};color:${fg}">

      <span class="tile-wm-n">${n}</span></button>`;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const won = v => (v == null ? "" : Number(v).toLocaleString() + "원");

let mode = "c";          // c=카페 d=정비·딜러
/* 카페는 시도 → 시군구 2단계, 딜러는 브랜드 → 시도 → 시군구 3단계로 판다.
   딜러가 1,137곳이라 지역만으로 나누면 한 타일에 수십 곳이 몰린다. */
let brand = null, region = null, filter = "ALL", q = "";

/* PIN·RECENT — 길안내 런처의 '최근 검색'과 같은 방식으로 localStorage 에 둔다.
   저장하는 건 검색어가 아니라 '고른 장소의 키'라 다시 찾을 필요가 없다. */
const PIN_KEY = "furycourse.pins.v1", RECENT_KEY = "furycourse.recent.v1", RECENT_MAX = 8;
const keyOf = r => r.k + "|" + r.name + "|" + r.lat.toFixed(5);
const readLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } };
let nearKind = "c";
let pins = new Set(readLS(PIN_KEY, []));
let recent = readLS(RECENT_KEY, []);
const savePins = () => localStorage.setItem(PIN_KEY, JSON.stringify([...pins]));
const saveRecent = () => localStorage.setItem(RECENT_KEY, JSON.stringify(recent.slice(0, RECENT_MAX)));
function touch(r){
  const k = keyOf(r);
  recent = [k, ...recent.filter(x => x !== k)].slice(0, RECENT_MAX);
  saveRecent();
}
let here = null;         // 내 위치 (허용 시)

/* 좌표가 없는 데이터가 섞이면 0(적도)으로 튀므로 Number.isFinite 로만 판정한다 */
const hasPos = r => Number.isFinite(r.lat) && Number.isFinite(r.lon);

function dist(r){
  if (!here || !hasPos(r)) return null;
  const R=6371, t=x=>x*Math.PI/180;
  const dp=t(r.lat-here.lat), dl=t(r.lon-here.lon);
  const a=Math.sin(dp/2)**2 + Math.cos(t(here.lat))*Math.cos(t(r.lat))*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function pool(){
  if (mode === "near")   return nearKind === "gas" ? gasPool() : DATA.filter(r => r.k === nearKind);
  if (mode === "pin")    return DATA.filter(r => pins.has(keyOf(r)));
  if (mode === "recent") return recent.map(k => DATA.find(r => keyOf(r) === k)).filter(Boolean);
  /* 주유소는 별도 레코드가 아니라 각 지점의 gasl 안에 들어 있다.
     오피넷 일일 한도 때문에 아직 일부 지점만 채워져 있어 지역 편중이 크다.
     그 사실을 화면에 적어 두고, 매일 채워지는 대로 저절로 늘어난다. */
  if (mode === "gas"){
    let g = gasPool();
    if (q){
      const s2 = q.toLowerCase();
      return g.filter(r => (r.name + " " + (r.addr||"") + " " + (r.near||"")).toLowerCase().includes(s2));
    }
    if (filter === "고급유") g = g.filter(r => r.pg);
    else if (filter === "경정비") g = g.filter(r => r.mt);
    if (region) g = g.filter(r => regionOf(r) === region);
    return g;
  }
  let rows = DATA.filter(r => r.k === mode);
  if (q){
    const s = q.toLowerCase();
    return rows.filter(r => (r.name+" "+(r.alt||[]).join(" ")+" "+(r.addr||"")+" "
      + brandsOf(r).join(" ")+" "+brandsOf(r).map(enOf).join(" ")+" "+(r.cat||"")
      ).toLowerCase().includes(s));
  }
  /* 딜러 모드에서 등급 필터는 '브랜드를 고른 뒤' 에만 건다.
     브랜드 타일 단계에서 걸면 해당 등급이 없는 브랜드가 통째로 사라져
     "브랜드가 왜 이것밖에 없지?" 가 된다. */
  const gradeOn = mode === "s" || !!brand;
  if (filter !== "ALL" && gradeOn)
    rows = rows.filter(r => mode === "s" ? (r.tags || []).includes(filter)
                          : r.gkind === filter);
  if (mode === "d" && brand) rows = rows.filter(r => hasBrand(r, brand));
  if (region) rows = rows.filter(r => regionOf(r) === region);
  return rows;
}

/* 브랜드 타일은 데이터에 담긴 순서(원산지 묶음)를 그대로 쓴다.

const METRO = ["서울","인천","대전","광주","대구","울산","부산","세종"];

const SIDO_SEQ = [...METRO, ...PROV];

/* 지역은 시도 17개가 아니라 권역 7개로 연다.
   대전 3 · 전북 4 · 전남 4 · 대구 3처럼 카페가 서너 곳뿐인 시도가 타일 하나씩 먹고 있었다.

   묶는 기준은 '오늘 어느 쪽으로 달릴까' 다 — 행정구역이 아니라 방향.
   경기만 따로 두는 이유: 카페 78곳으로 전체의 36% 다. 수도권으로 묶으면
   한 타일이 절반을 담고, 눌렀을 때 시군구 50여 개가 쏟아져 지금보다 나빠진다.
   서울은 카페가 10곳뿐이라(인천 17곳보다 적다) 인천과 함께 둔다 —
   바이크 카페는 도심이 아니라 외곽에 있다.
   강원·제주는 곳 수가 적어도 남긴다. 방향이 달라 어디에도 붙일 수 없다.

   순서는 지도 그대로 — 윗줄 서→동, 아랫줄 중→남서→남동, 마지막 제주. */
const REGIONS = [
  ["서울·인천", ["서울", "인천"]],
  ["경기",      ["경기"]],
  ["강원",      ["강원"]],

  ["제주",      ["제주"]],
];
const REGION_SEQ = REGIONS.map(([n]) => n);
const REGION_OF = Object.fromEntries(REGIONS.flatMap(([n, ss]) => ss.map(s => [s, n])));
const regionOf = r => REGION_OF[r.sido] || r.sido;

/* 브랜드 표기는 영문 워드마크로 통일한다. 이미지 로고는 쓰지 않는다. */
const BRAND_EN = {"BMW 모토라드": "BMW MOTORRAD", "두카티": "DUCATI", "KTM": "KTM", "허스크바나": "HUSQVARNA", "트라이엄프": "TRIUMPH", "베스파/피아지오": "VESPA", "로얄엔필드": "ROYAL ENFIELD", "야마하": "YAMAHA", "스즈키": "SUZUKI", "가와사키": "KAWASAKI", "혼다": "HONDA", "CFMOTO": "CFMOTO", "존테스": "ZONTES", "SYM": "SYM", "대림(디앤에이모터스)": "DNA MOTORS", "KR모터스(효성)": "KR MOTORS", "할리데이비슨": "HARLEY-DAVIDSON", "인디언": "INDIAN"};
const BRAND_COLOR = {"BMW 모토라드": ["#0066B1", "#FFFFFF"], "두카티": ["#A81217", "#FFFFFF"], "KTM": ["#FF9500", "#16130F"], "허스크바나": ["#1A2E5A", "#FFFFFF"], "트라이엄프": ["#1C1C1C", "#FFFFFF"], "베스파/피아지오": ["#6FB3A0", "#12160C"], "로얄엔필드": ["#6E1F1F", "#FFFFFF"], "야마하": ["#1B2A78", "#FFFFFF"], "스즈키": ["#1F86D0", "#FFFFFF"], "가와사키": ["#6EA204", "#12160C"], "혼다": ["#E60012", "#FFFFFF"], "CFMOTO": ["#111827", "#F97316"], "존테스": ["#0E3A5F", "#7FD1E8"], "SYM": ["#0F6E78", "#FFFFFF"], "대림(디앤에이모터스)": ["#00539F", "#FFFFFF"], "KR모터스(효성)": ["#C8102E", "#FFFFFF"], "할리데이비슨": ["#E2571E", "#16130F"], "인디언": ["#A67C3D", "#191510"]};
const BRAND_MARK = {"BMW 모토라드": "BMW", "두카티": "DU", "KTM": "KTM", "허스크바나": "HQV", "트라이엄프": "TR", "베스파/피아지오": "VE", "로얄엔필드": "RE", "야마하": "YA", "스즈키": "SU", "가와사키": "KW", "혼다": "HO", "CFMOTO": "CF", "존테스": "ZT", "SYM": "SYM", "대림(디앤에이모터스)": "DNA", "KR모터스(효성)": "KR", "할리데이비슨": "HD", "인디언": "IN"};
const enOf = b => BRAND_EN[b] || b;

/* 용품 취급품목 — 라이더가 찾는 순서. step10 의 GEAR_TAG_ORDER 와 같아야 한다 */
const GEAR_TAGS = ["헬멧","의류","장갑·부츠","가방","전장·통신"];

/* 수입사가 겹치면 한 매장이 여러 브랜드를 함께 단다.
   (모토스타코리아 → CFMOTO·존테스, KR모터스 → KR·SYM 등)
   데이터에서 한 자리로 합쳐 두었으므로 여기서는 bs 목록을 펼쳐 쓴다.
   어느 브랜드로 찾아도 같은 카드가 나오고, 타일 개수에도 각각 잡힌다. */
const brandsOf = r => r.bs && r.bs.length ? r.bs : (r.brand ? [r.brand] : []);
const hasBrand = (r, b) => brandsOf(r).includes(b);
/* 브랜드별 등급이 다를 수 있다 — 대림 대리점이면서 존테스 서비스인 곳처럼 */
const gradeFor = (r, b) => (r.bg && r.bg[b]) || r.grade || r.gkind || "";

/* 타일 순서는 원산지 묶음(유럽→일본→중국→대만→한국→미국)을 그대로 쓴다.
   데이터 등장 순서로 뽑으면 여러 브랜드를 다는 매장 때문에 순서가 흐트러진다. */
const BRAND_SEQ = Object.keys(BRAND_EN)
  .filter(b => DATA.some(r => r.k === "d" && hasBrand(r, b)));

/* 주유소는 별도 레코드가 아니라 각 지점의 gasl 안에 들어 있다.
   '내 주변 → 주유소' 를 위해 이름+거리로 중복을 걷어내 한 벌로 만든다.
   좌표는 없고(오피넷이 지점 기준 거리만 준다) 지점에 딸린 정보라,
   가까운 지점의 좌표를 빌려 거리 정렬에만 쓴다. */
let GAS = null;
function gasPool(){
  if (GAS) return GAS;
  const seen = new Map();
  DATA.forEach(r => (r.gasl || []).forEach(g => {
    const k = g.n;
    if (!seen.has(k) || seen.get(k).d > g.d)
      seen.set(k, {k:"g", name:g.n, addr:(r.addr||"").split(" ").slice(0,3).join(" ") + " 인근",
                   sido:r.sido, gu:r.gu, pd:r.pd,
                   lat:r.lat, lon:r.lon, d:g.d, g:g.g, pg:g.pg, pp:g.pp, mt:g.mt,
                   near:r.name});
  }));
  GAS = [...seen.values()];
  return GAS;
}
function countBy(rows, key){
  const m = new Map();
  /* 브랜드는 한 매장이 여러 개를 달 수 있어 각각 세어 준다 — 합계가 매장 수보다 많다 */
  /* 권역은 레코드에 그대로 들어 있지 않다 — 시도를 묶어 만든다 */
  const valueOf = key === "region" ? regionOf : r => r[key];
  if (key === "brand")
    rows.forEach(r => brandsOf(r).forEach(b => m.set(b, (m.get(b)||0)+1)));
  else
    rows.forEach(r => { const v = valueOf(r) || "기타"; m.set(v, (m.get(v)||0)+1); });
  const e = [...m.entries()];
  if (key === "brand")
    return e.sort((a,b) => BRAND_SEQ.indexOf(a[0]) - BRAND_SEQ.indexOf(b[0]));
  if (key === "region"){
    const rank = v => { const i = REGION_SEQ.indexOf(v); return i < 0 ? 99 : i; };
    return e.sort((a,b) => rank(a[0]) - rank(b[0]));
  }
  return e.sort((a,b) => b[1]-a[1]);
}

/* ── 지금 문이 열려 있는가 ────────────────────────────────
   hw 는 요일 표다. [{d:"월",s:"10:00",e:"20:00",br:[["13:00","14:00"]],nd:1}, {d:"화"}]
   시간이 없는 요일은 그날 쉰다는 뜻이다. d 가 "매일" 이면 모든 요일에 적용한다.
   e 가 s 보다 이르면 자정을 넘겨 영업한다(22:00~02:00).
   판단 근거가 없으면 초록도 빨강도 칠하지 않는다 — 회색이 '모름' 이다. */
const DAY_KO = ["일","월","화","수","목","금","토"];
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1]*60 + +m[2] : null; };

function todayRow(hw, dow){
  if (!hw || !hw.length) return null;
  const ko = DAY_KO[dow];
  return hw.find(w => w.d === ko)
      || hw.find(w => w.d === "매일")
      || hw.find(w => w.d === "평일" && dow >= 1 && dow <= 5)
      || hw.find(w => w.d === "주말" && (dow === 0 || dow === 6))
      || null;
}

function openState(r, now){
  now = now || new Date();
  /* 오늘이 임시휴무로 지정돼 있으면 시간표보다 우선한다 */
  const md = `${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  if ((r.hoff || []).some(d => String(d).slice(-5) === md)) return 0;

  const cur = now.getHours()*60 + now.getMinutes();
  const dow = now.getDay();
  const row = todayRow(r.hw, dow);
  if (row){
    if (row.s == null || row.e == null) return 0;        /* 시간이 없는 요일 = 휴무 */
    const s = toMin(row.s), e = toMin(row.e);
    if (s == null || e == null) return null;
    const inRange = (e > s) ? (cur >= s && cur < e) : (cur >= s || cur < e);  /* 자정 넘김 */
    if (!inRange) return 0;
    if ((row.br || []).some(([a,b]) => { const x=toMin(a), y=toMin(b);
        return x != null && y != null && cur >= x && cur < y; })) return 0;   /* 브레이크타임 */
    return 1;
  }
  /* 어제가 자정을 넘겨 오늘 새벽까지 여는 경우 */
  const prev = todayRow(r.hw, (dow + 6) % 7);
  if (prev && prev.s != null && prev.e != null){
    const s = toMin(prev.s), e = toMin(prev.e);
    if (s != null && e != null && e <= s && cur < e) return 1;
  }
  return null;
}

function badges(r){
  const b = [];
  if (r.cl) b.push(["wn","폐업 의심"]);
  /* 화면 모드가 아니라 카드 종류로 가른다.
     '내 주변'(mode="near")에서는 카페가 딜러 가지로 떨어져 빈 등급 칸이 생겼다. */
  if (r.k === "c"){
    if (r.meal) b.push(["ok","식사 가능"]);
    if (r.cat) b.push(["", r.cat]);
    if (r.rv != null) b.push(["", "리뷰 " + r.rv.toLocaleString()]);
    if (r.rt != null) b.push(["", "★ " + r.rt]);
    if (r.pk) b.push(["", "주차"]);
  } else if (r.k === "s"){
    /* 수입사가 직접 밝힌 취급점이라 근거가 확실하다 — 네이버 업종 추정과 구분해 표시한다 */
    if (r.taichi) b.push(["ok", "RS TAICHI"]);
    (r.tags || []).slice(0, 5).forEach(t => b.push(["", t]));
    if (r.rv != null) b.push(["", "리뷰 " + r.rv.toLocaleString()]);
    if (r.rt != null) b.push(["", "★ " + r.rt]);
    if (r.pk) b.push(["", "주차"]);
  } else {
    /* 브랜드를 고르지 않았으면 어느 브랜드를 다는지 전부 보여준다.
       고른 뒤에는 그 브랜드의 등급만 — 다른 브랜드 등급까지 붙으면 읽기 어렵다. */
    const bl = brandsOf(r);
    if (!brand) bl.forEach(b2 => b.push(["", enOf(b2)]));
    const gd = gradeFor(r, brand || bl[0]);
    if (gd) b.push(["", gd]);           /* 등급을 모르면 빈 칸을 만들지 않는다 */
    if (brand && bl.length > 1)
      b.push(["", "+ " + bl.filter(x => x !== brand).map(enOf).join(" · ")]);
  }
  const st = openState(r);
  if (st === 1) b.push(["op", "영업 중"]);
  else if (st === 0) b.push(["cl", todayRow(r.hw, new Date().getDay())
      && todayRow(r.hw, new Date().getDay()).s == null ? "오늘 휴무" : "영업 종료"]);
  if (r.hw && r.hw.length){
    const t = todayRow(r.hw, new Date().getDay());
    if (t && t.s) b.push(["", `오늘 ${t.s}~${t.e}`]);
  } else if (r.hours) b.push(["", r.hours.length > 22 ? r.hours.slice(0,22)+"…" : r.hours]);
  /* 주유 정보는 정비·딜러에서만 — 카페는 쉬러 가는 곳이라 유가가 붙으면 시선만 흐트러진다 */
  if (r.k === "d" && r.prem) b.push(["fu", "고급유 " + r.prem.d + "m"
      + (r.prem.p ? " " + r.prem.p.toLocaleString() : "") + (r.pd ? " (" + r.pd + ")" : "")]);
  if (r.cvs1 != null) b.push([r.cvs1 ? "" : "wn", "편의점 " + r.cvs1 + (r.cvsm ? "·" + r.cvsm + "m" : "")]);
  return b.map(([c,t]) => `<span class="b ${c}">${esc(t)}</span>`).join("");
}

/* iOS 의 "'OO'에서 열겠습니까?" 확인창은 웹에서 끌 수 없다 — 커스텀 스킴이면 무조건 뜬다.
   유일한 우회는 앱이 등록한 유니버설 링크(https). 2026-08-17 AASA 실측 결과:
     카카오맵   applink.map.kakao.com  paths ["*"]              → 확인창 없음
     네이버지도 m.map.naver.com        paths ["/launchApp/*"]   → 확인창 없음
     카카오내비 kakaonavi.kakao.com     /launch/index.do 뿐인데
                브리지가 결국 kakaonavi:// 를 다시 불러 확인창이 뜬다
     T맵       AASA 자체가 없음                                → 확인창 불가피
   그래서 되는 둘만 https 로 보내고, 나머지는 스킴을 유지한다. */
/* 안드로이드는 intent:// 로 보낸다.
   package 를 지정하면 크롬이 확인창 없이 곧장 앱을 열고,
   앱이 없으면 S.browser_fallback_url 로 플레이스토어를 띄운다.
   아이폰에는 intent:// 가 없어 스킴/유니버설 링크를 쓴다 — 그래서 빌드를 둘로 나눈다. */
const PKG = {tmap:"com.skt.tmap.ku", naver:"com.nhn.android.nmap",
             knavi:"com.locnall.KimGiSa", kmap:"net.daum.android.map",
             gmap:"com.google.android.apps.maps"};
const store = p => encodeURIComponent(`https://play.google.com/store/apps/details?id=${p}`);
const intent = (path, scheme, pkg) =>
  `intent://${path}#Intent;scheme=${scheme};package=${pkg};S.browser_fallback_url=${store(pkg)};end`;

function navButtons(r){
  const enc = encodeURIComponent(r.name), la = r.lat, lo = r.lon;
  const addrEnc = encodeURIComponent(r.addr || r.name);
  const did = r.nid ? `&did=${r.nid}` : "";
  const clip = esc(r.nk ? (r.addr || r.name) : r.name);
  const clipLabel = r.nk ? "주소" : "이름";

  if (PLATFORM === "android"){
    return `<div class="btns">
      <a class="n-tmap"  href="${intent(`route?goalname=${enc}&goalx=${lo}&goaly=${la}`, "tmap", PKG.tmap)}">T맵으로 안내</a>
      <a class="n-naver" href="${intent(`route/car?dlat=${la}&dlng=${lo}&dname=${enc}&appname=coffeerun`, "nmap", PKG.naver)}">네이버지도로 안내</a>
      <button class="n-kakao" data-clip="${clip}" data-navi="${intent("navigate", "kakaonavi", PKG.knavi)}">카카오내비 (${clipLabel} 복사)</button>
      <a class="n-kmap"  href="${intent(`route?ep=${la},${lo}&en=${enc}&by=car`, "daummaps", PKG.kmap)}">카카오맵 길안내</a>
      <a class="n-google" href="https://www.google.com/maps/dir/?api=1&destination=${addrEnc}&travelmode=driving">구글지도로 안내</a>
    </div>`;
  }

  const naverUL = `https://m.map.naver.com/launchApp/route?path=route&type=place`
    + `&dlat=${la}&dlng=${lo}${did}&dname=${enc}`
    + `&appname=${encodeURIComponent("https://kimogoon.github.io/navi-launcher/furycourse.html")}`;
  return `<div class="btns">
    <a class="n-tmap"  href="tmap://route?rGoName=${enc}&rGoX=${lo}&rGoY=${la}">T맵으로 안내</a>
    <a class="n-naver" href="${naverUL}">네이버지도로 안내</a>
    <button class="n-kakao" data-clip="${clip}">카카오내비 (${clipLabel} 복사)</button>
    <a class="n-kmap"  href="https://applink.map.kakao.com/route?sp=&sn=&ep=${la}%2C${lo}&en=${enc}&by=car">카카오맵 길안내</a>
    <a class="n-apple" href="https://maps.apple.com/?q=${enc}&ll=${la},${lo}">Apple 지도에서 보기</a>
    <a class="n-google" href="https://www.google.com/maps/dir/?api=1&destination=${addrEnc}&travelmode=driving">구글지도로 안내</a>
  </div>`;
}

/* 집은 주소만 등록할 수도 있다 — 좌표가 없으면 '검색어로 목적지 지정' 방식으로 보낸다.
   네이버는 스킴(nmap://)을 쓰면 확인창이 뜬다. AASA 의 /launchApp/* 는 좌표 없는
   search 도 덮으므로 여기서도 유니버설 링크를 쓴다 — 일반 카드와 같은 조건이 된다.
   T맵은 AASA 자체가 없어(2026-08-17 재확인, 404) 확인창을 없앨 방법이 없다. */
function navButtonsAddr(dest){
  const q = encodeURIComponent(dest);
  if (PLATFORM === "android"){
    return `<div class="btns">
      <a class="n-tmap"  href="${intent(`search?name=${q}`, "tmap", PKG.tmap)}">T맵으로 안내</a>
      <a class="n-naver" href="${intent(`search?query=${q}&appname=coffeerun`, "nmap", PKG.naver)}">네이버지도로 안내</a>
      <button class="n-kakao" data-clip="${esc(dest)}" data-navi="${intent("navigate", "kakaonavi", PKG.knavi)}">카카오내비 (주소 복사)</button>
      <a class="n-kmap"  href="${intent(`search?q=${q}`, "daummaps", PKG.kmap)}">카카오맵에서 찾기</a>
      <a class="n-google" href="https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=driving">구글지도로 안내</a>
    </div>`;
  }
  return `<div class="btns">
    <a class="n-tmap"  href="tmap://search?name=${q}">T맵으로 안내</a>
    <a class="n-naver" href="https://m.map.naver.com/launchApp/search?query=${q}`
    + `&appname=${encodeURIComponent("https://kimogoon.github.io/navi-launcher/furycourse.html")}">네이버지도로 안내</a>
    <button class="n-kakao" data-clip="${esc(dest)}">카카오내비 (주소 복사)</button>
    <a class="n-kmap"  href="https://applink.map.kakao.com/?q=${q}">카카오맵에서 찾기</a>
    <a class="n-apple" href="https://maps.apple.com/?daddr=${q}&dirflg=d">Apple 지도로 안내</a>
    <a class="n-google" href="https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=driving">구글지도로 안내</a>
  </div>`;
}

/* ── 집 ──────────────────────────────────────────────
   등록 방법은 둘. 집에 서서 '지금 위치'로 잡으면 좌표까지 남아 모든 내비가 열리고,

const HOME_KEY = "coffeerun.home";
let home = null;
try { home = JSON.parse(localStorage.getItem(HOME_KEY) || "null"); } catch(e){ home = null; }
function saveHome(h){

}

         이 기기에만 저장되며 어디로도 전송되지 않습니다.</p>
      <button class="go pri" id="homeHere" type="button">지금 있는 곳을 집으로 저장</button>

    </div>`;

  $("#screen").innerHTML = `<article class="card open" data-k="h">
      <div class="card-head"><span class="bar"></span>
        <div class="card-main">
          <div class="card-name-row"><span class="card-name">집</span></div>
          <div class="card-addr">${esc(home.addr || (home.lat.toFixed(5) + ", " + home.lon.toFixed(5)))}</div>
        </div>
      </div>
      <div class="panel">

        <p class="hint">T맵과 카카오내비는 iOS가 띄우는 "열겠습니까?" 확인을 한 번 거칩니다.
          웹에서 끌 수 없는 시스템 창이라 두 앱은 어쩔 수 없습니다.
          네이버지도·카카오맵·Apple·구글은 확인창 없이 바로 열립니다.</p>
        ${Number.isFinite(home.lat) ? "" :
          `<button class="home-edit" id="homeHere" type="button">집 앞이라면 · 지금 위치로 좌표 채우기</button>`}
        <button class="home-edit" id="homeReset" type="button">집 다시 등록하기</button>

/* 패널은 카드를 펼칠 때 비로소 만든다.
   미리 다 그리면 카드 한 장이 내비 버튼 6개와 메뉴·주유 목록까지 안고 있어
   목록 300장에 DOM 노드가 1만을 넘는다. 폰에서 첫 그리기가 눈에 띄게 느려진다. */
function panel(r){
  const rows = [];
  const add = (k,v) => { if (v) rows.push(`<div class="row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`); };
  /* 여러 브랜드를 다는 자리는 브랜드별 등급이 다르다 — 한 줄에 모아 보여준다 */
  if (r.bs && r.bs.length > 1)
    add("취급 브랜드", r.bs.map(b => `${enOf(b)} ${gradeFor(r, b)}`).join(" · "));
  if (r.alt && r.alt.length) add("다른 상호", r.alt.join(" · "));
  if (r.k === "s" && r.tags) add("취급품목", r.tags.join(" · ")
      + (r.tag_guess && r.tag_guess.length ? `  (${r.tag_guess.join("·")}은 상호에서 추정)` : ""));
  add("영업시간", r.hours);
  add("휴무", r.off);
  add("전화", r.tel);
  add("취급", r.svc || r.disp);
  if (r.cvs1 != null) add("편의점", `1km ${r.cvs1}곳 · 3km ${r.cvs3 ?? "-"}곳` + (r.cvsm ? ` · 최근접 ${r.cvsm}m` : ""));
  if (r.k === "d" && r.cheap) add("최저가", `${r.cheap.n} ${won(r.cheap.p)} · ${r.cheap.d}m`);

  /* 용품점이 직접 올려 둔 상품 목록 — 메뉴와 같은 자리에 같은 모양으로 보여준다 */
  const items = r.items && r.items.length
    ? `<div class="menu">${r.items.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : "";

  const menu = r.menu && r.menu.length
    ? `<div class="menu">${r.menu.map(m => `<span>${esc(m.n)}${m.p && /^\d+$/.test(m.p) && +m.p < 200000 ? " " + (+m.p).toLocaleString() : ""}</span>`).join("")}</div>`
    : "";

  const gas = r.k === "d" && r.gasl && r.gasl.length
    ? `<ul class="gas">${r.gasl.map(s => `<li><span>${esc(s.n)}</span><span>${s.d}m</span>`
        + `<span class="p">${s.g ? s.g.toLocaleString() : "-"}</span>`
        + (s.pg ? `<span class="x">고급 ${s.pp ? s.pp.toLocaleString() : ""}${s.mt ? " · 경정비" : ""}</span>` : "")
        + `</li>`).join("")}</ul>` : "";

  const links = [];
  if (r.ig) links.push(`<a class="ig" href="${esc(r.ig)}" target="_blank" rel="noopener">인스타그램</a>`);
  if (r.hp) links.push(`<a href="${esc(r.hp)}" target="_blank" rel="noopener">홈페이지</a>`);
  if (r.nu) links.push(`<a href="${esc(r.nu)}" target="_blank" rel="noopener">네이버 플레이스</a>`);
  if (r.ku) links.push(`<a href="${esc(r.ku)}" target="_blank" rel="noopener">카카오맵</a>`);

  return `<div class="panel">
    ${rows.length ? `<dl class="rows">${rows.join("")}</dl>` : ""}
    ${items}${menu}${gas}
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
    ${navButtons(r)}
  </div>`;
}

/* 주유소 길안내는 이름으로 보낸다.
   오피넷은 지점으로부터의 거리만 주고 주유소 좌표는 주지 않는다 —
   그래서 gasPool 이 가까운 지점의 좌표를 빌려 쓰고 있다.
   그 좌표로 안내하면 주유소가 아니라 그 카페·정비소로 데려간다.
   동명 주유소가 많으므로(재정주유소만 여러 곳) 시군구를 앞에 붙여 검색어를 만든다. */
function gasNav(g){
  const q = encodeURIComponent(`${g.gu || g.sido || ""} ${g.name}`.trim());
  if (PLATFORM === "android"){
    return `<div class="btns n3">
      <a class="n-tmap"  href="${intent(`search?name=${q}`, "tmap", PKG.tmap)}">T맵</a>
      <button class="n-kakao" data-clip="${esc(g.name)}" data-navi="${intent("navigate", "kakaonavi", PKG.knavi)}">카카오내비</button>
      <a class="n-naver" href="${intent(`search?query=${q}&appname=coffeerun`, "nmap", PKG.naver)}">네이버지도</a>
    </div>`;
  }
  return `<div class="btns n3">
    <a class="n-tmap"  href="tmap://search?name=${q}">T맵</a>
    <button class="n-kakao" data-clip="${esc(g.name)}">카카오내비</button>
    <a class="n-naver" href="https://m.map.naver.com/launchApp/search?query=${q}`
    + `&appname=${encodeURIComponent("https://kimogoon.github.io/navi-launcher/furycourse.html")}">네이버지도</a>
  </div>`;
}

function gasCard(g){
  const d = dist(g);
  const b = [];
  /* 라이더가 주유소에서 보는 건 두 값이다 — 일반과 고급.
     고급유를 안 파는 곳은 그 사실 자체가 정보라 '고급유 없음' 으로 적는다. */
  if (g.g)  b.push(["", "일반 " + g.g.toLocaleString()]);
  if (g.pg) b.push(["fu", "고급 " + (g.pp ? g.pp.toLocaleString() : "취급")]);
  else      b.push(["wn", "고급유 없음"]);
  if (g.pd) b.push(["", g.pd + " 기준"]);
  if (g.mt) b.push(["ok", "경정비"]);
  b.push(["", g.near + " 인근"]);
  return `<article class="card" data-k="g">
    <div class="card-head"><span class="bar" style="background:var(--fuel)"></span>
      <div class="card-main">
        <div class="card-name-row"><span class="card-name">${esc(g.name)}</span></div>
        <div class="card-addr">${esc(g.addr)}</div>
        <div class="badges">${b.map(([c,t]) => `<span class="b ${c}">${esc(t)}</span>`).join("")}</div>
      </div>
      ${d != null ? `<span class="dist">${d < 1 ? Math.round(d*1000)+"m" : d.toFixed(1)+"km"}</span>` : ""}
    </div>
    <div class="panel" style="display:flex">${gasNav(g)}</div></article>`;
}

function card(r, i){
  const d = dist(r);
  const st = openState(r);
  return `<article class="card" data-k="${r.k}" data-i="${i}"${st == null ? "" : ` data-open="${st}"`}>
    <div class="card-head"><span class="bar"></span>
      <div class="card-main">
        <div class="card-name-row">${r.k === "d" ? brandsOf(r).map(b => badge(b, true)).join("") : ""}
          <span class="card-name">${r.cl ? `<s>${esc(r.name)}</s>` : esc(r.name)}</span></div>
        <div class="card-addr">${esc(r.addr)}</div>
        <div class="badges">${badges(r)}</div>
      </div>
      ${d != null ? `<span class="dist">${d < 1 ? Math.round(d*1000)+"m" : d.toFixed(1)+"km"}</span>` : ""}
      <button class="pin ${pins.has(keyOf(r)) ? "on" : ""}" data-pin="${esc(keyOf(r))}"
        aria-label="PIN" aria-pressed="${pins.has(keyOf(r))}">${pins.has(keyOf(r)) ? "★" : "☆"}</button>
    </div><div class="panel"></div></article>`;
}

/* RUN 버튼과 지역 레일.
   지역을 격자로 깔면 카테고리를 바꿀 때마다 화면 절반이 타일로 찬다.
   버튼 하나로 접어 두고, 열면 큰 카드가 좌우로 흐르며 가운데에 딱 멈춘다. */
/* ── 날씨 ────────────────────────────────────────────
   Open-Meteo — 키가 필요 없고 CORS 도 열려 있어 페이지에서 바로 부를 수 있다.
   라이더가 알고 싶은 건 기온과 '비/눈이 오는가' 다. 그 둘만 크게 보여준다.

   위치는 이미 알고 있는 것만 쓴다 — 첫 화면을 열자마자 위치 권한을 묻지 않는다.
   등록해 둔 집 → '내 주변'으로 잡아 둔 좌표 → 없으면 서울 시청 순.
   기준이 어디인지는 화면에 적는다. */
const WX_KEY = "coffeerun.wx";
const SEOUL = {lat: 37.5665, lon: 126.9780, label: "서울 기준"};
let wx = null;
try { wx = JSON.parse(sessionStorage.getItem(WX_KEY) || "null"); } catch(e){ wx = null; }

/* WMO 코드 → 라이더 기준 분류. 비·눈은 따로 표시한다 — 젖은 노면이 제일 중요하다 */
/* 비·눈·뇌우일 때만 '젖음'. 안개는 시야 문제지 노면 문제는 아니라 따로 둔다. */
const isWet = c => (c >= 51 && c <= 67) || (c >= 71 && c <= 86) || c >= 95;

function wxKind(c){
  if (c === 0) return ["맑음", "sun", 0];
  if (c <= 2)  return ["구름 조금", "cloudsun", 0];
  if (c === 3) return ["흐림", "cloud", 0];
  if (c <= 48) return ["안개", "fog", 1];
  if (c <= 57) return ["이슬비", "rain", 1];
  if (c <= 67) return ["비", "rain", 1];
  if (c <= 77) return ["눈", "snow", 1];
  if (c <= 82) return ["소나기", "rain", 1];
  if (c <= 86) return ["눈", "snow", 1];
  return ["뇌우", "storm", 1];
}
const WX_SVG = {
  sun:`<circle cx="12" cy="12" r="5"/><path d="M12 1.6v2.6M12 19.8v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.6 12h2.6M19.8 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/>`,

  cloud:`<path d="M7.5 19h9.9a3.7 3.7 0 0 0 .3-7.4 5.1 5.1 0 0 0-9.8-.3A3.8 3.8 0 0 0 7.5 19z"/>`,

  rain:`<path d="M7.5 14.5h9.9a3.7 3.7 0 0 0 .3-7.4 5.1 5.1 0 0 0-9.8-.3 3.8 3.8 0 0 0-.4 7.7z"/><path d="M8.5 18l-1 3M13 18l-1 3M17.5 18l-1 3"/>`,
  snow:`<path d="M7.5 14.5h9.9a3.7 3.7 0 0 0 .3-7.4 5.1 5.1 0 0 0-9.8-.3 3.8 3.8 0 0 0-.4 7.7z"/><path d="M9 19.2v.02M13 18.4v.02M17 19.2v.02M11 21.4v.02M15 21.4v.02"/>`,
  storm:`<path d="M7.5 13.8h9.9a3.7 3.7 0 0 0 .3-7.4 5.1 5.1 0 0 0-9.8-.3 3.8 3.8 0 0 0-.4 7.7z"/><path d="M13.2 16.2 10 20.4h3l-1.4 3.4"/>`,
};

function wxPoint(){
  if (home && Number.isFinite(home.lat)) return {lat: home.lat, lon: home.lon, label: "집 기준"};
  if (here) return {lat: here.lat, lon: here.lon, label: "현재 위치"};
  return SEOUL;
}

async function loadWx(force){
  const p = wxPoint();
  /* 15분 안에 같은 자리로 받아 둔 값이 있으면 다시 부르지 않는다 */
  if (!force && wx && wx.label === p.label && Date.now() - wx.at < 15 * 60 * 1000) return wx;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`
      + `&current=temperature_2m,weather_code&timezone=Asia%2FSeoul`;
    const j = await (await fetch(u)).json();
    wx = {t: Math.round(j.current.temperature_2m), code: j.current.weather_code,
          label: p.label, at: Date.now()};
    try { sessionStorage.setItem(WX_KEY, JSON.stringify(wx)); } catch(e){}
  } catch(e){ wx = wx || null; }
  return wx;
}

/* 큰 원 안에 들어가므로 button 을 쓰지 않는다 — 버튼 안의 버튼은 만들 수 없다 */
function wxHTML(){
  if (!wx) return `<span class="wx"><span class="d"><b>날씨 확인 중</b></span></span>`;
  const [label, icon, bad] = wxKind(wx.code);
  return `<span class="wx${bad ? " warn" : ""}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${WX_SVG[icon]}</svg>
    <span class="t">${wx.t}°</span>
    <span class="d"><b>${label}</b><span>${wx.label}</span></span>
  </span>`;
}

/* 아직 아무것도 안 고른 카테고리 화면 — 여기서는 목록 대신 큰 원을 보여준다 */
/* 첫 화면인가 — 아직 아무것도 안 골랐고, 목록을 직접 열지도 않은 상태 */
let forceList = false;
const isLanding = () => ["c","d","s","gas","recent"].includes(mode)
  && !region && !brand && !q && !forceList
  && !(mode === "recent" && !recent.length);      /* 본 곳이 없으면 원을 세울 것도 없다 */

/* 원 안에 세울 말. SHOP 만 브랜드가 흐르므로 여기 없다.
   길이에 따라 글자를 줄이려고 단계를 함께 둔다. */
const CIRCLE_WORD = {c: "RUN", s: "GEAR", gas: "GAS STATION", recent: "RECENT"};
const wordStep = n => n > 12 ? 4 : n > 8 ? 3 : n > 5 ? 2 : 1;

function renderRunbar(){
  /* 지금 화면이 무엇을 고르는 자리인지에 따라 레일 내용이 달라진다.
       SHOP 에서 브랜드를 고르기 전 → 브랜드
       그 밖에는                   → 지역
     '내 주변'·PIN·RECENT·집 처럼 고를 것이 없는 화면에서는 버튼을 감춘다.
     예전에는 mode 로 DATA 를 걸러 base 가 비는 바람에 '0곳' 이 떴다. */
  const box = $("#runbar");
  if (mode === "near" || mode === "pin" || mode === "recent" || mode === "home" || isLanding()){
    box.innerHTML = ""; return;     /* 첫 화면에서는 큰 원이 RUN 을 맡는다 */
  }
  const brandPick = mode === "d" && !brand;
  const base = mode === "gas" ? gasPool()
             : mode === "d"   ? DATA.filter(r => r.k === "d" && (!brand || hasBrand(r, brand)))
             : DATA.filter(r => r.k === mode);

  let items, cur;
  if (brandPick){
    items = [["전체 브랜드", null], ...BRAND_SEQ
      .filter(bn => base.some(r => hasBrand(r, bn)))
      .map(bn => [enOf(bn), bn])];
    cur = "전체 브랜드";
  } else {
    const has = new Set(base.map(regionOf));
    items = [["전국", null], ...REGION_SEQ.filter(n => has.has(n)).map(n => [n, n])];
    cur = region || "전국";
  }

  /* 지금까지 고른 것을 그대로 잇는다 — YAMAHA · 경기 */
  const parts = [];
  if (mode === "d" && brand) parts.push(enOf(brand));
  if (region) parts.push(region);
  const label = parts.length ? parts.join(" · ") : "RUN";
  const btn = `<button class="runbtn" id="runbtn" type="button" aria-expanded="${railOpen}">`
    + `<span class="rl">${esc(label)}</span>`
    + `<span class="rc" aria-hidden="true"></span></button>`;

  const rail = railOpen
    ? `<div class="rail" id="rail" role="listbox" aria-label="${brandPick ? "브랜드" : "지역"}">`
      + items.map(([lab, val]) => {
          const on = brandPick ? (val === brand || (!brand && val === null))
                               : ((val || "전국") === cur);
          const col = brandPick && val ? BRAND_COLOR[val] : null;
          const st = col ? ` style="background:${col[0]};border-color:transparent"` : "";
          const tc = col ? ` style="color:${col[1]}"` : "";
          return `<button class="rcard${col ? " rbrand" : ""}" role="option"`
            + ` data-v="${esc(val === null ? "" : val)}" aria-current="${on}"${st}>`
            + `<b${tc}>${esc(lab)}</b></button>`;
        }).join("")
      + `</div>`
    : "";
  box.innerHTML = btn + rail;

  /* 열자마자 지금 고른 것이 가운데 보이게 — 매번 맨 앞부터 찾게 만들지 않는다 */
  if (railOpen){
    const sel = $(`#rail .rcard[aria-current=true]`);
    if (sel) sel.scrollIntoView({inline:"center", block:"nearest"});
  }
}

function render(){
  const rows = pool();
  if (typeof $("#runbar") !== "undefined" && $("#runbar")) renderRunbar();

  if (typeof qBack !== "undefined") syncBack();
  /* 한 줄로 흐르다 보니 고른 칩이 화면 밖으로 밀려 있을 수 있다 — 보이는 자리로 끌어온다 */
  requestAnimationFrame(() => {
    ["#modeSeg", "#filterSeg", "#nearBar"].forEach(sel => {
      const on = document.querySelector(`${sel} button[aria-pressed=true]`);
      if (!on) return;
      const box = on.parentElement, l = on.offsetLeft, r = l + on.offsetWidth;
      if (l < box.scrollLeft || r > box.scrollLeft + box.clientWidth)
        box.scrollTo({left: Math.max(0, l - 12), behavior: "smooth"});
    });
  });
  if (typeof qNear !== "undefined"){
    qNear.setAttribute("aria-pressed", String(mode === "near"));
    qPin.setAttribute("aria-pressed", String(mode === "pin"));
    qHome.setAttribute("aria-pressed", String(mode === "home"));
  }

  /* 모드 세그 */
  /* 내 주변에는 자체 카테고리 줄(nearBar)이 있다. 둘 다 알약 모양이라 나란히 두면
     같은 줄이 두 개 있는 것처럼 보인다 — 내 주변일 때는 카테고리 칩을 감춘다. */
  $("#modeSeg").style.display = mode === "near" ? "none" : "";
  const modeCount = v => v === "gas" ? gasPool().length : DATA.filter(r => r.k === v).length;
  /* 카테고리 이름은 영문 한 단어로. 칩이 여섯 개라 한글 네 글자씩 붙으면 두 줄로 접힌다.
     판매·정비·부품·전시가 한데 있는 자리라 SHOP 으로 묶는다. */
  $("#modeSeg").innerHTML = [["c","COFFEE"],["d","SHOP"],["s","GEAR"],["gas","GAS STATION"]]
    .filter(([v]) => modeCount(v) > 0)
    .map(([v,l]) =>
    `<button data-m="${v}" aria-pressed="${mode===v}">${l}<span class="n">${modeCount(v)}</span></button>`).join("")
    /* PIN 칩은 두지 않는다 — 바로 아래 퀵바의 PIN 버튼과 같은 일을 한다.
       같은 기능이 화면에 둘이면 어느 쪽이 무엇인지 헷갈린다. */
    + (recent.length ? `<button data-m="recent" aria-pressed="${mode==="recent"}">RECENT<span class="n">${recent.length}</span></button>` : "");

  /* 필터 세그 */
  if (mode === "near"){
    $("#filterSeg").innerHTML = "";
    const label = {c:"COFFEE", d:"SHOP", s:"GEAR", gas:"GAS STATION"}[nearKind];
    if (!here){
      $("#crumbs").innerHTML = `<span>위치를 확인하는 중…</span>`;
      $("#screen").innerHTML = `<p class="empty">위치 접근을 허용하면 가까운 순으로 보여드립니다.</p>`;
      return;
    }
    const sorted = [...rows].sort((a,b) => (dist(a) ?? 9e9) - (dist(b) ?? 9e9)).slice(0, 60);
    $("#crumbs").innerHTML = `<span>내 주변 ${label} · 가까운 순</span>`;
    $("#screen").innerHTML = sorted.length
      ? `<div class="list">${sorted.map(r => nearKind === "gas" ? gasCard(r) : card(r, DATA.indexOf(r))).join("")}</div>`
      : `<p class="empty">주변에 표시할 곳이 없습니다.</p>`;
    return;
  }
  if (mode === "home"){
    $("#filterSeg").innerHTML = "";
    homeScreen();
    return;
  }
  if (mode === "pin" || (mode === "recent" && !isLanding())){
    $("#filterSeg").innerHTML = "";
    $("#crumbs").innerHTML = `<span>${mode === "pin" ? "PIN" : "RECENT"}</span>`
      + ` <button data-lv="0">전체 보기</button>`;
    $("#screen").innerHTML = rows.length
      ? `<div class="list">${rows.map(r => card(r, DATA.indexOf(r))).join("")}</div>`
      : `<p class="empty">${mode === "pin" ? "카드의 ☆ 를 눌러 PIN 에 담아보세요." : "아직 열어본 곳이 없습니다."}</p>`;
    return;
  }
  if (mode === "c"){
    /* 카페 등급(저장목록·검수통과·후보·보류)은 자료를 모으며 내가 붙인 검수 상태다.
       라이더에게는 아무 의미가 없는 말이라 칩으로 세우지 않는다. */
    $("#filterSeg").innerHTML = "";
  } else if (mode === "d" && !brand){    /* 브랜드 고르기 전에는 등급 칩을 숨긴다 */
    $("#filterSeg").innerHTML = "";
  } else if (mode === "gas"){
    const all = gasPool();
    const opts = [["고급유", all.filter(r=>r.pg).length], ["경정비", all.filter(r=>r.mt).length]];
    $("#filterSeg").innerHTML =
      `<button data-f="ALL" aria-pressed="${filter==="ALL"}">전체<span class="n">${all.length}</span></button>` +
      opts.filter(([,n]) => n).map(([v,n]) =>
        `<button data-f="${v}" aria-pressed="${filter===v}">${v}<span class="n">${n}</span></button>`).join("");
  } else if (mode === "s"){
    /* 용품점은 등급이 없다 — 라이더가 찾는 건 '무엇을 파느냐' 다 */
    const base = DATA.filter(r => r.k === "s");
    const cnt = new Map();
    base.forEach(r => (r.tags || []).forEach(t => cnt.set(t, (cnt.get(t)||0)+1)));
    const opts = GEAR_TAGS.filter(t => cnt.get(t)).map(t => [t, cnt.get(t)]);
    $("#filterSeg").innerHTML =
      `<button data-f="ALL" aria-pressed="${filter==="ALL"}">전체<span class="n">${base.length}</span></button>` +
      opts.map(([v,n]) => `<button data-f="${esc(v)}" aria-pressed="${filter===v}">`
        + `${esc(v)}<span class="n">${n}</span></button>`).join("");
  } else {
  const base = mode === "d"
    ? DATA.filter(r => r.k === "d" && hasBrand(r, brand))
    : DATA.filter(r => r.k === mode);
  const key = mode === "c" ? "tier" : "gkind";
  const opts = countBy(base, key);
  $("#filterSeg").innerHTML =
    `<button data-f="ALL" aria-pressed="${filter==="ALL"}">전체<span class="n">${base.length}</span></button>` +
    opts.map(([v,n]) => `<button data-f="${esc(v)}" aria-pressed="${filter===v}">`
      + `${esc(v)}<span class="n">${n}</span></button>`).join("");
  }

  /* 경로 — 지금 어디를 보고 있는지 한 줄. 되돌아가기는 RUN 버튼과 뒤로 버튼이 맡는다. */
  /* 곳 수는 적지 않는다 — 위 칩에 이미 있고, 목록을 보면 보인다 */
  const cr = [];
  if (mode === "d" && brand)
    cr.push(`<button data-lv="1">${badge(brand, true)} ${esc(enOf(brand))}</button>`);
  if (region) cr.push(`<span>${esc(region)}</span>`);
  if (mode === "gas") cr.push(`<span class="cov">아직 일부 지역만 — 매일 채워집니다</span>`);
  $("#crumbs").innerHTML = q ? `<span>"${esc(q)}" 검색 결과</span>` : cr.join(" ");

  const screen = $("#screen");

  if (isLanding()){
    /* 첫 화면은 카테고리마다 할 일이 다르다.
         COFFEE  RUN  → 담아 둔 곳(PIN)
         SHOP    브랜드가 원 안에서 좌우로 흐른다 → 고른 브랜드 목록
         GEAR    RUN  → 전체 목록
         GAS     RUN  → '내 주변'을 켜고 가까운 순 목록
       원은 가만히 있고 내용만 바뀐다 — 누를 자리가 매번 같아야 손이 기억한다. */
    const wet = wx && isWet(wx.code) ? " wet" : "";
    let inner;
    if (mode === "d"){
      const names = ["BRAND", ...BRAND_SEQ.map(enOf)];
      inner = `<div class="bwin"><div class="bstrip" id="bstrip">`
        + names.map(n => `<span class="rw" data-len="${wordStep(n.length)}">${esc(n)}</span>`).join("")
        + `</div></div>`;
    } else {
      const w = CIRCLE_WORD[mode] || "RUN";
      inner = `<span class="rw" data-len="${wordStep(w.length)}">${w}</span>`;
    }
    /* 날씨는 COFFEE 에서만. 나머지는 글자 하나로 끝내는 편이 원이 깔끔하다 —
       달리기 전에 하늘을 보는 건 카페로 갈 때다. */
    const showWx = mode === "c";
    screen.innerHTML = `<div class="landing">
      <div class="runring"><div class="runbig${showWx ? wet : ""}" id="runbig" role="button" tabindex="0"
           aria-label="${mode === "d" ? "브랜드 고르기" : "목록 열기"}">`
      + inner + (showWx ? wxHTML() : "") + `</div></div>
    </div>`;
    if (!showWx) return;
    loadWx().then(w => {
      if (!w || !isLanding() || mode !== "c") return;
      const big = $("#runbig");
      if (!big || !big.querySelector(".wx")) return;
      big.querySelector(".wx").outerHTML = wxHTML();
      big.classList.toggle("wet", isWet(w.code));   /* 비가 오면 원 전체가 빨강 */
    });
    return;
  }

  if (!rows.length){ screen.innerHTML = `<p class="empty">해당하는 곳이 없습니다.</p>`; return; }

  /* 화면은 언제나 목록이다. 브랜드도 지역도 위쪽 RUN 레일에서 고른다 —
     격자로 깔면 카테고리를 옮길 때마다 화면 절반이 타일로 찬다.

     위치를 한 번 잡았다는 이유로 정렬을 바꾸지 않는다. 예전에는 here 가 있으면
     무조건 거리순이라 '내 주변'을 한 번 쓰고 나면 그 뒤로 순서가 계속 흐트러졌다.
     가까운 순으로 보고 싶으면 '내 주변'이 그 일을 한다. */
  const sorted = here ? [...rows].sort((a,b) => (dist(a) ?? 9e9) - (dist(b) ?? 9e9)) : rows;

  /* 브랜드도 지역도 안 고른 SHOP 은 1,334장이다 — 한 번에 그리면 DOM 이 1만 9천 노드가 되고
     폰에서 첫 그리기가 눈에 띄게 밀린다. 끊어서 그리고 눌러서 이어 붙인다.
     고른 것이 바뀌면(카테고리·브랜드·지역·필터·검색) 다시 처음부터. */
  const sg = `${mode}|${brand}|${region}|${filter}|${q}|${nearKind}`;
  if (sg !== listSig){ listSig = sg; listLimit = LIST_STEP; }
  const shown = sorted.slice(0, listLimit);
  const more = sorted.length - shown.length;

  screen.innerHTML = `<div class="list">${shown.map(r =>
      r.k === "g" ? gasCard(r) : card(r, DATA.indexOf(r))).join("")}</div>`
    + (more > 0 ? `<button class="more" id="moreBtn" type="button">`
        + `${more.toLocaleString()}곳 더 보기</button>` : "");
}

/* ── 이벤트 ── */
$("#modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pushHist();
  mode = b.dataset.m; filter = "ALL"; brand = region = null; railOpen = false; q = ""; forceList = false;
  input.value = ""; syncIO(); nearBar.classList.remove("on"); render();
});
$("#filterSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pushHist();
  filter = b.dataset.f; render();
});
$("#crumbs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pushHist();
  if (b.dataset.lv === "0"){ mode = "c"; brand = region = null; filter = "ALL"; }  /* PIN·RECENT 에서 빠져나온다 */
  else if (b.dataset.lv === "1"){ brand = null; filter = "ALL"; }   /* 브랜드 고르기로 되돌아간다 */
  render();
});
$("#screen").addEventListener("click", e => {
  if (e.target.closest("#runbig")){
    pushHist();
    if (mode === "d"){
      /* 원 안에서 가운데에 와 있는 브랜드를 고른다 — 첫 칸(BRAND)은 '전체' 다 */
      const st = $("#bstrip");
      const i = st ? Math.round(st.scrollLeft / st.clientWidth) : 0;
      brand = i === 0 ? null : BRAND_SEQ[i - 1];
      filter = "ALL";
      if (!brand) region = null;
    } else if (mode === "c"){
      if (!pins.size){ alert("카드의 ☆ 를 눌러 PIN 에 담아보세요."); HIST.pop(); return; }
      mode = "pin";                       /* 커피는 담아 둔 곳부터 */
    } else if (mode === "gas"){
      mode = "near"; nearKind = "gas";    /* 주유소는 가까운 곳이 전부다 */
      nearBar.classList.add("on");
      nearBar.querySelectorAll("button").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.nk === "gas")));
      if (!here) locate();
    } else {
      region = null;                      /* GEAR·RECENT — 그냥 목록 */
      forceList = true;
    }
    render();
    return;
  }
  /* 첫 화면에서는 레일이 #screen 안에 뜬다 — 헤더 쪽과 같은 규칙으로 처리한다 */
  const lrc = e.target.closest(".rcard");
  if (lrc){
    pushHist();
    const v = lrc.dataset.v || null;
    if (mode === "d" && !brand) { brand = v; filter = "ALL"; }
    else region = v;
    railOpen = false;
    render();
    return;
  }
  const tile = e.target.closest(".tile");
  if (tile){
    pushHist();
    brand = tile.dataset.v; filter = "ALL";      /* 화면에 남은 타일은 브랜드뿐이다 */
    render(); return;
  }
  if (e.target.closest("#moreBtn")){
    listLimit += LIST_STEP;
    const sig = listSig; render(); listSig = sig;   /* 이어 붙이기지 새 목록이 아니다 */
    return;
  }
  const clip = e.target.closest("[data-clip]");
  if (clip){
    const t = clip.dataset.clip, old = clip.textContent;
    const target = clip.dataset.navi || "kakaonavi://";
    const go = () => setTimeout(() => { location.href = target; }, 250);
    if (navigator.clipboard?.writeText){
      navigator.clipboard.writeText(t).then(() => { clip.textContent = "복사됨 · 카카오내비 실행"; go();
        setTimeout(() => clip.textContent = old, 2200); }).catch(go);
    } else go();
    return;
  }
  const pin = e.target.closest("[data-pin]");
  if (pin){
    const k = pin.dataset.pin;
    pins.has(k) ? pins.delete(k) : pins.add(k);
    savePins(); render(); return;
  }
  const head = e.target.closest(".card-head");
  if (head && mode !== "home"){       /* 집 카드는 늘 펼쳐진 상태다 — 접으면 내비 버튼이 사라진다 */
    /* 아코디언 — 한 번에 하나만 연다. 카드가 펼쳐지면 화면이 길어져서
       두 개가 동시에 열리면 목록을 훑기가 어렵다. */
    const card = head.parentElement;
    const wasOpen = card.classList.contains("open");
    document.querySelectorAll(".card.open").forEach(c => c.classList.remove("open"));
    if (wasOpen) return;                 /* 열린 걸 다시 누르면 닫기만 */
    card.classList.add("open");
    const r = DATA[+card.dataset.i];
    const pn = card.querySelector(".panel");
    if (r && pn && !pn.dataset.built){        /* 한 번 만든 패널은 다시 만들지 않는다 */
      pn.outerHTML = panel(r);
      card.querySelector(".panel").dataset.built = "1";
    }
    if (r) touch(r);
    /* 위쪽 카드를 닫으면서 화면이 줄어들면 방금 연 카드가 시야 밖으로 밀린다 */
    requestAnimationFrame(() => {
      const top = card.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * 0.55)
        card.scrollIntoView({block: "start", behavior: "smooth"});
    });
  }
});

const input = $("#searchInput"), io = $("#io");
/* SVG 에는 hidden IDL 속성이 없다 — 아이콘 전환은 반드시 클래스+CSS display 로. */
function syncIO(){
  const filled = !!input.value.trim();
  io.classList.toggle("is-clear", filled);
  io.classList.toggle("is-paste", !filled);
  io.setAttribute("aria-label", filled ? "지우기" : "붙여넣기");
}
input.addEventListener("input", e => {
  const v = e.target.value.trim();
  /* 글자마다 쌓으면 뒤로가기를 열 번 눌러야 원래 자리로 돌아간다.
     검색을 '시작한' 순간(빈 칸 → 글자)에만 직전 화면을 기록한다. */
  if (!q && v) pushHist();
  q = v; syncIO(); render();
});
io.addEventListener("click", async () => {
  if (input.value.trim()){
    input.value = ""; q = ""; syncIO(); input.focus(); render(); return;
  }
  if (!navigator.clipboard?.readText){ input.focus(); return; }
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (!t){ input.focus(); return; }
    if (!q && t) pushHist();
    input.value = t; q = t; syncIO(); render();
  } catch(e){ input.focus(); }
});
syncIO();

/* ── 뒤로 가기 ────────────────────────────────────────
   화면 상태는 이 일곱 값이 전부다. 한 단계 움직이기 직전의 값을 쌓아 두고
   되돌릴 때 그대로 복원한다. 브라우저 히스토리를 쓰지 않는 이유는
   홈화면 앱(standalone)에는 뒤로 갈 주소창이 없어서다 — 스와이프도 안 먹는다. */
const HIST = [], HIST_MAX = 50;
const snap = () => ({mode, brand, region, filter, q, nearKind, forceList});
const same = (a, b) => a && b && Object.keys(a).every(k => a[k] === b[k]);

function pushHist(){
  const s = snap();
  if (same(HIST[HIST.length - 1], s)) return;   /* 같은 자리를 두 번 쌓지 않는다 */
  HIST.push(s);
  if (HIST.length > HIST_MAX) HIST.shift();
}
function restore(s){
  mode = s.mode; brand = s.brand; region = s.region; railOpen = false; forceList = s.forceList;
  filter = s.filter; q = s.q; nearKind = s.nearKind;
  input.value = q; syncIO();
  nearBar.classList.toggle("on", mode === "near");
  if (mode === "near") nearBar.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.nk === nearKind)));
  document.querySelectorAll(".card.open").forEach(c => c.classList.remove("open"));
  render();
}
function syncBack(){
  const b = $("#qBack");
  if (b){ b.disabled = HIST.length === 0; b.setAttribute("aria-disabled", String(HIST.length === 0)); }
}

const qNear = $("#qNear"), qPin = $("#qPin"), qHome = $("#qHome"),
      qReset = $("#qReset"), qBack = $("#qBack");

$("#runbar").addEventListener("click", e => {
  const rb = e.target.closest("#runbtn");
  if (rb){ railOpen = !railOpen; renderRunbar(); return; }
  const rc = e.target.closest(".rcard");
  if (rc){
    pushHist();
    const v = rc.dataset.v || null;
    if (mode === "d" && !brand) { brand = v; filter = "ALL"; }
    else region = v;
    railOpen = false;      /* 고르면 접힌다 — 목록을 보러 온 것이지 고르는 화면을 보러 온 게 아니다 */
    render();
    return;
  }
});

qBack.addEventListener("click", () => {
  if (!HIST.length) return;
  restore(HIST.pop());
});
syncHomeLabel();

const nearBar = $("#nearBar");

function locate(){
  if (!navigator.geolocation){ alert("이 브라우저는 위치를 지원하지 않습니다."); return; }
  qNear.classList.add("busy");
  navigator.geolocation.getCurrentPosition(
    p => { here = {lat: p.coords.latitude, lon: p.coords.longitude};
           qNear.classList.remove("busy"); render(); },
    () => { qNear.classList.remove("busy"); mode = "c"; nearBar.classList.remove("on");
            render(); alert("위치 접근이 거부되었습니다. 설정에서 허용해주세요."); },
    {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
}

qNear.addEventListener("click", () => {
  pushHist();
  if (mode === "near"){                       /* 다시 누르면 빠져나온다 */
    mode = "c"; nearBar.classList.remove("on"); render(); return;
  }
  mode = "near"; filter = "ALL"; brand = region = null; railOpen = false; q = "";
  input.value = ""; syncIO(); nearBar.classList.add("on");
  render();
  if (!here) locate(); 
});

nearBar.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pushHist();
  nearKind = b.dataset.nk;
  nearBar.querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  render();
});

qPin.addEventListener("click", () => {
  if (!pins.size){ alert("카드의 ☆ 를 눌러 PIN 에 담아보세요."); return; }
  pushHist();
  mode = (mode === "pin") ? "c" : "pin";
  filter = "ALL"; brand = region = null; railOpen = false; q = ""; input.value = ""; syncIO(); render();
});

qHome.addEventListener("click", () => {
  pushHist();
  mode = (mode === "home") ? "c" : "home";
  filter = "ALL"; brand = region = null; railOpen = false; q = "";
  input.value = ""; syncIO(); nearBar.classList.remove("on"); render();
});

/* 집 등록 화면의 버튼들 — 화면이 다시 그려질 때마다 새로 생기므로 위임으로 받는다 */
$("#screen").addEventListener("click", e => {
  if (e.target.closest("#homeHere")){
    if (!navigator.geolocation){ alert("이 브라우저는 위치를 지원하지 않습니다."); return; }
    const btn = e.target.closest("#homeHere");
    btn.disabled = true; btn.textContent = "위치를 확인하는 중…";
    navigator.geolocation.getCurrentPosition(
      pos => { const typed = (document.getElementById("homeAddr") || {}).value || "";
               /* 이미 등록된 집에 좌표만 채우는 경우가 있다 — 주소를 지우지 않는다 */
               saveHome({lat: pos.coords.latitude, lon: pos.coords.longitude,
                         addr: typed || (home && home.addr) || ""});
               render(); },
      () => { btn.disabled = false; btn.textContent = "지금 있는 곳을 집으로 저장";
              alert("위치 접근이 거부되었습니다. 주소를 직접 적어주세요."); },
      {enableHighAccuracy:true, timeout:8000, maximumAge:0});
    return;
  }
  if (e.target.closest("#homeSave")){
    const v = (document.getElementById("homeAddr").value || "").trim();
    if (!v){ alert("주소를 입력해주세요."); return; }
    saveHome({addr: v}); render(); return;
  }
  if (e.target.closest("#homeReset")){ saveHome(null); render(); return; }
});

qReset.addEventListener("click", () => {
  pushHist();
  mode = "c"; filter = "ALL"; brand = region = null; railOpen = false; q = ""; nearKind = "c"; forceList = false;
  input.value = ""; syncIO(); nearBar.classList.remove("on");
  document.querySelectorAll(".card.open").forEach(c => c.classList.remove("open"));
  window.scrollTo({top: 0, behavior: "smooth"});
  render();
});

/* 목록이 헤더 밑으로 들어가면 경계선을 켠다. 선이 늘 있으면 화면이 답답하고,
   없으면 카드가 헤더에 붙어 잘린 것처럼 보인다. */
/* 담아 둔 곳은 첫 화면(랜딩)의 ★ PIN 칸에 함께 나온다 —
   따로 PIN 모드로 시작하지 않는다. 첫 화면은 큰 RUN 원과 날씨가 주인공이다. */

const head = document.querySelector(".head");
const onScroll = () => head.classList.toggle("stuck", window.scrollY > 4);
addEventListener("scroll", onScroll, {passive:true});
onScroll();

render();
</script>
</body></html>
